# 색인·노출 확인 — 레퍼런스가 언제 완성됐는지 날짜로 남긴다
#
# 크롤러 방문은 서버가 기록하지만, 검색에 나오는지는 밖에서 검색해 봐야 안다.
# "언제부터 나왔는지"를 기억으로 말하면 영업에서 못 쓴다.
#
# 확인이 끝나면 케이스 리포트를 다시 만들어 커밋한다.
# 영업에서 링크로 보내는 문서라 손으로 갱신하면 반드시 낡는다.
#
# 필요한 시크릿: DATABASE_URL (Neon 연결 문자열)

name: serp

on:
  schedule:
    - cron: "41 22 * * *"   # 07:41 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    # 10분: 최근 실행 5분 37초~6분 8초(10/2~10/5). 잡 시간 초과는 continue-on-error 가 안 듣고 커밋 단계를 날린다
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: pg 설치
        run: npm install pg --no-save --silent
        working-directory: academy
      - name: 색인·노출 확인
        working-directory: academy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          # 스크립트가 .env.local 을 먼저 읽으므로 러너에도 만들어 준다
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local
          node scripts/check-index.mjs

      # 고객사마다 다시 진단해 「지금 점수」를 남긴다. 착수 점수만 있으면
      # 고친 게 먹혔는지 모른다 — 아이로그가 44 → 75 가 된 걸 하루 넘게 몰랐다.
      - name: 재진단
        working-directory: academy
        continue-on-error: true
        run: node scripts/rescan.mjs

      - name: 케이스 리포트 갱신
        working-directory: academy
        run: node scripts/case-report.mjs --out ../web/public/case/academy.html

      # 문서딱 저장소 주간 성장 리포트(서치콘솔·Cloudflare)·후보 이슈를 DB 로(Step 36). 하루 한 번이면 된다 —
      # 리포트는 주 1회(월 09:23 KST)다. 기본 토큰은 공개 저장소 읽기 한도용(새 키 아님). 실패해도 케이스 리포트 커밋은 간다
      - name: 문서딱 성장 리포트 가져오기
        working-directory: academy
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/growth-import.mjs

      - name: 바뀐 게 있으면 커밋
        run: |
          set -euo pipefail
          rm -f academy/.env.local
          if git diff --quiet -- web/public/case/academy.html; then
            echo "리포트에 바뀐 내용 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/case/academy.html
          git commit -m "케이스 리포트 갱신 ($(date -u +%Y-%m-%d))"
          git push
