# 상태 점검 — 사람도 세션도 없는 시간의 파수꾼
#
# 예약 실행(cron)은 클로드 세션이 살아 있어야 돈다. 세션이 죽으면 아무도 안 본다.
# 이건 GitHub 이 돌리므로 그것과 상관없이 계속 돈다.
#
# 문제가 있으면 일부러 실패시킨다. 실패하면 저장소 주인에게 메일이 간다.
# 그래서 잡는 것은 "진짜 문제"만이어야 한다 —
# 사소한 걸로 실패시키면 메일에 무뎌지고, 무뎌지면 진짜 문제도 놓친다.
#
# 보는 것
#   주요 주소가 200 을 주는가
#   robots.txt 가 전부 막고 있지 않은가  (한 번 그렇게 나가 있었다)
#   36시간 안에 크롤러가 왔는가
#   마지막 발행이 열흘을 넘지 않았는가
#
# 필요한 시크릿: DATABASE_URL

name: health

on:
  schedule:
    - cron: "19 */6 * * *"   # 6시간마다. :00 을 피한다
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pg 설치
        run: npm install pg --no-save --silent
        working-directory: academy
      - name: 상태 점검
        working-directory: academy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          # 스크립트가 .env.local 을 먼저 읽으므로 러너에도 만들어 준다
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local
          node scripts/health.mjs
