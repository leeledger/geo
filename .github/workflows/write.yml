# 주간 글 초안을 스스로 쓴다.
#
# 자동으로 도는 넷(정찰·노출측정·스냅샷·브리핑)은 전부 「재는 일」이었다.
# 「쓰는 일」에 담당이 없어서 사람이 멈추면 발행도 멈췄다. 그 자리를 메운다.
#
# 주제는 auto-post.mjs --pick 이 고른다 (Step 43). 회사 루프의 주간 초안과 같은 길 하나다 — 길이 둘이면 주 1편이 깨진다(D92).
#   안 불린 질문·경쟁이 이기는 질문·지는 검색어·주제 은행을 점수로 모아, 쓴 주제·최근 글과 겹치는 것을 뺀다
#   과정·모집 주제는 재료(재료표·상담 말)가 있어야 write-draft, 아니면 write-news 가 검색 근거를 달고 쓴다
#
# 전에는 여기서 news 를 먼저 돌리고 실패하면 draft 로 넘어갔다. 그런데 draft 가 모드 사실에서
# news 를 또 부른다 — 한 주에 검색 생성이 두 번 돌았다(KG-15-6). 이제 한 번만 부른다.
# news 를 꼭 따로 돌려야 하면 workflow_dispatch 에서 news 를 고른다.
#
# 여기서는 발행하지 않는다. 초안으로만 넣는다.
# 주 1편 자동 글은 회사 루프(company.mjs weekly-draft → auto-post.mjs --pick)가 주제를 고르고,
# 자동 감수(출처 원문 대조·AI 티·원장 관점·가림)를 다 통과한 글만 나간다(Step 43). 사람은 나간 글을 훑고 이상하면 내린다.
#
# 키가 없으면 종료코드 78 로 건너뛴다. 실패로 표시하지 않는다 —
# 매주 빨간불이 뜨면 진짜 고장났을 때 아무도 안 본다.
name: write

on:
  schedule:
    - cron: "7 21 * * 0"   # 월요일 06:07 KST — 정찰(06:37) 보다 앞에 둔다
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = 주제를 골라 씀 · news = 바깥 소식만 강제 · review-dry = 자동 감수를 러너에서 dry 로(아무것도 안 씀)"
        type: choice
        options: [auto, news, review-dry]
        default: auto
      slug:
        description: "review-dry 로 볼 글 슬러그"
        type: string
        default: "2027-algorithm-talent-admission-kookmin"

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: pg 설치
        run: npm install pg --no-save --silent

      # 원장 Max 구독으로 도는 Claude Code. API 크레딧 없이 측정·초안·분석을 한다(2026-09-22)
      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code@2.1.278 --silent  # 로컬에서 시험한 판. 올릴 때는 플래그·출력·한도 문구를 다시 본다

      - name: 환경 준비
        working-directory: academy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local

      - name: 초안 쓰기
        id: write
        working-directory: academy
        env:
          # 아무거나 있으면 쓴다. 우선순위는 anthropic → gemini → groq.
          # 단 news 는 검색 근거가 필요해서 제미나이가 있어야 돈다.
          LLM_PROXY_URL: ${{ secrets.LLM_PROXY_URL }}
          LLM_PROXY_TOKEN: ${{ secrets.LLM_PROXY_TOKEN }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MEASURE_RESERVE: ${{ vars.CLAUDE_MEASURE_RESERVE }}
          CLAUDE_DAILY_MAX: ${{ vars.CLAUDE_DAILY_MAX }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRITER_PROVIDER: ${{ vars.WRITER_PROVIDER }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
          MODE: ${{ inputs.mode || 'auto' }}
          SLUG: ${{ inputs.slug }}
        run: |
          set +e
          # 한 번만 부른다. 주제·갈래는 auto-post 가 고르고 쓰기 스크립트를 한 번 부른다
          if [ "$MODE" = "news" ]; then
            node scripts/write-news.mjs
          elif [ "$MODE" = "review-dry" ]; then
            # 러너 IP 에서 언론사 출처를 가져올 수 있는지 보는 자리(D86). DB·본문은 안 쓴다
            node scripts/auto-post.mjs --review "$SLUG" --dry
          else
            node scripts/auto-post.mjs --pick
          fi
          code=$?
          # 78 은 건너뜀이다 — 키·크레딧이 없거나, 재료도 사실도 없어 일부러 안 쓴 것이다.
          # 매주 빨간불이 뜨면 진짜 고장났을 때 아무도 안 본다
          if [ "$code" = "78" ]; then
            echo "::notice::이번 주는 초안을 안 썼습니다(종료 78). 글감이 없거나 이번 주 글이 이미 있습니다(주 1편)."
            exit 0
          fi
          exit $code

      # 슬러그를 꼭 넘긴다. 없으면 발행된 글만 보고 방금 쓴 초안(published=false)은 건너뛴다.
      - name: AI 티 검사
        working-directory: academy
        continue-on-error: true
        run: node scripts/slop-check.mjs ${{ steps.write.outputs.slug }}
