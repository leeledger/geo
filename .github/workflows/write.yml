# 주간 글 초안을 스스로 쓴다.
#
# 자동으로 도는 넷(정찰·노출측정·스냅샷·브리핑)은 전부 「재는 일」이었다.
# 「쓰는 일」에 담당이 없어서 사람이 멈추면 발행도 멈췄다. 그 자리를 메운다.
#
# 발행까지 하지 않는다. 초안으로만 넣는다 —
# CLAUDE.md 의 「사람만 할 수 있는 일 · 발행 전 사실 확인」이고,
# 지어낸 문장 하나가 다른 문서와 어긋나면 레퍼런스 전체가 죽는다.
#
# ANTHROPIC_API_KEY 가 없으면 종료코드 78 로 건너뛴다. 실패로 표시하지 않는다 —
# 매주 빨간불이 뜨면 진짜 고장났을 때 아무도 안 본다.
name: write

on:
  schedule:
    - cron: "7 21 * * 0"   # 월요일 06:07 KST — 정찰(06:37) 보다 앞에 둔다
  workflow_dispatch:

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: pg 설치
        run: npm install pg --no-save --silent

      - name: 환경 준비
        working-directory: academy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local

      - name: 초안 쓰기
        working-directory: academy
        env:
          # 둘 중 아무거나 있으면 쓴다. Groq 은 무료 한도가 있어 0원으로 시작할 수 있다.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRITER_PROVIDER: ${{ vars.WRITER_PROVIDER }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
        run: |
          set +e
          node scripts/write-draft.mjs
          code=$?
          if [ "$code" = "78" ]; then
            echo "::notice::GROQ_API_KEY 나 ANTHROPIC_API_KEY 가 없어 건너뜁니다. Secrets 에 하나만 넣으면 매주 초안이 나옵니다."
            exit 0
          fi
          exit $code

      - name: AI 티 검사
        working-directory: academy
        continue-on-error: true
        run: node scripts/slop-check.mjs
