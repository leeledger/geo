# 주간 글 초안을 스스로 쓴다.
#
# 자동으로 도는 넷(정찰·노출측정·스냅샷·브리핑)은 전부 「재는 일」이었다.
# 「쓰는 일」에 담당이 없어서 사람이 멈추면 발행도 멈췄다. 그 자리를 메운다.
#
# 길은 write-draft.mjs 가 고른다 (Step 15). 여기서 갈래를 정하지 않는다.
#   모드 재료  안 쓴 재료 3개 이상 — 원장이 실제로 들은 말로 쓴다
#   모드 사실  재료가 모자람 — write-news.mjs 로 넘긴다. 검색 근거를 달고 출처를 남긴다
#   모드 없음  둘 다 없음 — 아무것도 안 쓰고 재료를 달라는 일감만 올린다(78)
#
# 전에는 여기서 news 를 먼저 돌리고 실패하면 draft 로 넘어갔다. 그런데 draft 가 모드 사실에서
# news 를 또 부른다 — 한 주에 검색 생성이 두 번 돌았다(KG-15-6). 이제 한 번만 부른다.
# news 를 꼭 따로 돌려야 하면 workflow_dispatch 에서 news 를 고른다.
#
# 발행까지 하지 않는다. 초안으로만 넣는다 —
# CLAUDE.md 의 「사람만 할 수 있는 일 · 발행 전 사실 확인」이고,
# 지어낸 문장 하나가 다른 문서와 어긋나면 레퍼런스 전체가 죽는다.
#
# 키가 없으면 종료코드 78 로 건너뛴다. 실패로 표시하지 않는다 —
# 매주 빨간불이 뜨면 진짜 고장났을 때 아무도 안 본다.
name: write

on:
  schedule:
    - cron: "7 21 * * 0"   # 월요일 06:07 KST — 정찰(06:37) 보다 앞에 둔다
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = 재료를 보고 알아서 · news = 바깥 소식만 강제"
        type: choice
        options: [auto, news]
        default: auto

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: pg 설치
        run: npm install pg --no-save --silent

      # 원장 Max 구독으로 도는 Claude Code. API 크레딧 없이 측정·초안·분석을 한다(2026-09-22)
      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code@2.1.278 --silent  # 로컬에서 시험한 판. 올릴 때는 플래그·출력·한도 문구를 다시 본다

      - name: 환경 준비
        working-directory: academy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local

      - name: 초안 쓰기
        id: write
        working-directory: academy
        env:
          # 아무거나 있으면 쓴다. 우선순위는 anthropic → gemini → groq.
          # 단 news 는 검색 근거가 필요해서 제미나이가 있어야 돈다.
          LLM_PROXY_URL: ${{ secrets.LLM_PROXY_URL }}
          LLM_PROXY_TOKEN: ${{ secrets.LLM_PROXY_TOKEN }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRITER_PROVIDER: ${{ vars.WRITER_PROVIDER }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: |
          set +e
          # 한 번만 부른다. 갈래는 write-draft 가 고르고 첫 줄에 「모드=…」 를 찍는다.
          # 예비 호출을 두면 write-draft 가 안에서 부르는 write-news 와 겹쳐 검색 생성이 두 번 돈다
          if [ "$MODE" = "news" ]; then
            node scripts/write-news.mjs
          else
            node scripts/write-draft.mjs
          fi
          code=$?
          # 78 은 건너뜀이다 — 키·크레딧이 없거나, 재료도 사실도 없어 일부러 안 쓴 것이다.
          # 매주 빨간불이 뜨면 진짜 고장났을 때 아무도 안 본다
          if [ "$code" = "78" ]; then
            echo "::notice::이번 주는 초안을 안 썼습니다(종료 78). 관리 화면의 「초안 재료」 일감을 보세요."
            exit 0
          fi
          exit $code

      # 슬러그를 꼭 넘긴다. 없으면 발행된 글만 보고 방금 쓴 초안(published=false)은 건너뛴다.
      - name: AI 티 검사
        working-directory: academy
        continue-on-error: true
        run: node scripts/slop-check.mjs ${{ steps.write.outputs.slug }}
