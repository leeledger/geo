# 주간 글 초안을 스스로 쓴다.
#
# 자동으로 도는 넷(정찰·노출측정·스냅샷·브리핑)은 전부 「재는 일」이었다.
# 「쓰는 일」에 담당이 없어서 사람이 멈추면 발행도 멈췄다. 그 자리를 메운다.
#
# 두 갈래가 있다.
#   news   바깥 사실로 여는 글. 제도 변경·대회 일정·공식 발표. 검색 근거를 달고 출처를 남긴다
#   draft  관점 글. 주제 은행에서 고른다. 숫자를 쓰지 않는다
# 기본은 news 다 — 관점 글은 학원 이름을 안 써도 홍보 틀이 되기 쉽다.
#
# 발행까지 하지 않는다. 초안으로만 넣는다 —
# CLAUDE.md 의 「사람만 할 수 있는 일 · 발행 전 사실 확인」이고,
# 지어낸 문장 하나가 다른 문서와 어긋나면 레퍼런스 전체가 죽는다.
#
# 키가 없으면 종료코드 78 로 건너뛴다. 실패로 표시하지 않는다 —
# 매주 빨간불이 뜨면 진짜 고장났을 때 아무도 안 본다.
name: write

on:
  schedule:
    - cron: "7 21 * * 0"   # 월요일 06:07 KST — 정찰(06:37) 보다 앞에 둔다
  workflow_dispatch:
    inputs:
      mode:
        description: "news = 바깥 소식(검색 근거) · draft = 관점 글"
        type: choice
        options: [news, draft]
        default: news

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: pg 설치
        run: npm install pg --no-save --silent

      # 원장 Max 구독으로 도는 Claude Code. API 크레딧 없이 측정·초안·분석을 한다(2026-09-22)
      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code@2.1.278 --silent  # 로컬에서 시험한 판. 올릴 때는 플래그·출력·한도 문구를 다시 본다

      - name: 환경 준비
        working-directory: academy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local

      - name: 초안 쓰기
        id: write
        working-directory: academy
        env:
          # 아무거나 있으면 쓴다. 우선순위는 anthropic → gemini → groq.
          # 단 news 는 검색 근거가 필요해서 제미나이가 있어야 돈다.
          LLM_PROXY_URL: ${{ secrets.LLM_PROXY_URL }}
          LLM_PROXY_TOKEN: ${{ secrets.LLM_PROXY_TOKEN }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRITER_PROVIDER: ${{ vars.WRITER_PROVIDER }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
          MODE: ${{ inputs.mode || 'news' }}
        run: |
          set +e
          if [ "$MODE" = "draft" ]; then
            node scripts/write-draft.mjs
            code=$?
          else
            node scripts/write-news.mjs
            code=$?
            # 뉴스는 검색 근거가 있어야 쓴다. 제미나이 무료는 근거 검색 한도가 0 이라 매주 여기서 섰다(2026-09-21).
            # 뉴스가 안 되면 관점 글 초안으로 넘어간다 — 주 1편이 목표지 뉴스가 목표가 아니다
            # 뉴스가 이미 글을 넣고(slug= 를 남기고) 그 뒤에 죽었으면 초안을 또 쓰지 않는다 — 두 벌이 된다
            if [ "$code" != "0" ] && ! grep -q '^slug=' "$GITHUB_OUTPUT" 2>/dev/null; then
              echo "::notice::뉴스 글을 못 써서(종료 $code) 관점 글 초안으로 넘어갑니다"
              node scripts/write-draft.mjs
              code=$?
            fi
          fi
          if [ "$code" = "78" ]; then
            echo "::notice::키나 크레딧이 없어 건너뜁니다. OpenRouter 크레딧을 채우면 매주 초안이 나옵니다."
            exit 0
          fi
          exit $code

      # 슬러그를 꼭 넘긴다. 없으면 발행된 글만 보고 방금 쓴 초안(published=false)은 건너뛴다.
      - name: AI 티 검사
        working-directory: academy
        continue-on-error: true
        run: node scripts/slop-check.mjs ${{ steps.write.outputs.slug }}
