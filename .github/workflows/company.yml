# 에이전트 회사 — 매시간 일감을 만들고 실제로 실행한다
#
# 대시보드 카드의 「다음 행동」을 가져가 실행하는 자리다 (academy/scripts/company.mjs).
# 로그인한 브라우저가 필요한 일(네이버 이관·구글 색인 요청)은 원장 PC 의 tools/local-agent.mjs 가 한다.
#
# 필요한 시크릿: DATABASE_URL, LLM_PROXY_URL, LLM_PROXY_TOKEN
name: company

on:
  schedule:
    - cron: "23 * * * *"
    - cron: "53 * * * *"   # 예약이 자주 건너뛰어진다 — 30분 뒤 한 번 더 기회. 겹치면 concurrency 가 줄 세운다
  workflow_dispatch: {}

# 한 시간 안에 안 끝나면 다음 실행은 기다린다. 같은 일감을 둘이 집지 않게
concurrency:
  group: company
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # 실패한 작업 다시 돌리기

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install pg --no-save --silent
        working-directory: academy
      # 원장 Max 구독으로 도는 Claude Code. API 크레딧 없이 측정·초안·분석을 한다(2026-09-22)
      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code@2.1.278 --silent  # 로컬에서 시험한 판. 올릴 때는 플래그·출력·한도 문구를 다시 본다

      - name: 환경 준비
        working-directory: academy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local
      - name: 출근 · 계획 · 실행
        working-directory: academy
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_PROXY_URL: ${{ secrets.LLM_PROXY_URL }}
          LLM_PROXY_TOKEN: ${{ secrets.LLM_PROXY_TOKEN }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          # 예비 공급자. OpenRouter 가 막히면 중계(Anthropic) → 제미나이 → Groq 로 넘어간다 (writer-common 공급자들)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/company.mjs
