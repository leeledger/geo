# 색인 알림 · 일별 스냅샷
#
# 이 파일은 만들어 놓고 한 번도 안 돌았다. YAML 이 깨져 있어서
# 매번 0초 만에 실패했고, 실패한 줄도 몰랐다.
# 원인은 curl 명령을 한 줄에 이어 붙이면서 따옴표 안에 줄바꿈이 들어간 것이다.
# 여러 줄 명령은 반드시 블록으로 쓴다.
#
# 필요한 시크릿
#   SNAPSHOT_URL   https://robotncoding.com/api/snapshot
#   CRON_SECRET    Vercel 환경변수 CRON_SECRET 과 같은 값

name: snapshot

on:
  schedule:
    - cron: "23 18 * * *"   # 03:23 KST
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 사이트맵 전체를 알린다. 목록을 여기 박아 두면 반드시 어긋난다.
      - name: 색인 알림 (IndexNow)
        continue-on-error: true
        working-directory: academy
        run: node scripts/indexnow.mjs

      - name: 스냅샷 기록
        env:
          URL: ${{ secrets.SNAPSHOT_URL }}
          KEY: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ]; then
            echo "SNAPSHOT_URL 시크릿이 없습니다"
            exit 1
          fi
          code=$(curl -sS -o body.json -w '%{http_code}' \
            --max-time 45 --retry 3 --retry-delay 10 --retry-all-errors \
            -H "authorization: Bearer ${KEY}" "$URL")
          echo "HTTP $code"
          cat body.json
          echo
          test "$code" = "200"
