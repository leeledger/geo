# 영업 담당 — 매주 월요일 케이스 리포트 갱신 · 영업 전화 묶음 · 리드 답장 초안 (academy/scripts/sales.mjs)
#
# 아무것도 보내지 않는다. 초안은 전부 원장의 「사람 대기」 줄로 간다.
# 공개본(web/public/case/academy.html)은 가림 검사를 통과해야만 쓰고, 커밋은 다음 단계가 따로 한다.
# web 을 푸시하면 Vercel 이 랜딩을 올린다.
# claude 는 도구 없이 빈 임시 폴더에서 한 번(주 1회). GitHub 토큰은 커밋 단계에만 있다.
#
# 필요한 시크릿: DATABASE_URL, CLAUDE_CODE_OAUTH_TOKEN
name: sales

on:
  schedule:
    - cron: "10 23 * * 0"   # 월요일 08:10 KST
  workflow_dispatch:
    inputs:
      mode:
        description: "run: 리포트·초안·커밋 · leak-test: 가림 검사 시험 · draft-test: 초안 숫자 검사 시험 (시험은 claude·커밋 없음)"
        type: choice
        options: [run, leak-test, draft-test]
        default: run

concurrency:
  group: sales
  cancel-in-progress: false

permissions:
  contents: write   # 케이스 리포트 공개본 커밋 (마지막 단계만 토큰을 쓴다)

jobs:
  sales:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 자격 증명을 .git/config 에 남기지 않는다. 푸시는 마지막 단계가 토큰 주소로 한다(repair 와 같은 모양)
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install pg --no-save --silent
        working-directory: academy
      - name: Claude Code 설치
        if: ${{ (inputs.mode || 'run') == 'run' }}
        run: npm install -g @anthropic-ai/claude-code@2.1.278 --silent  # company.yml 과 같은 판
      # case-report.mjs 가 .env.local 을 읽는다. 초안 claude 는 도구 없이 임시 폴더에서 돌고 DATABASE_URL 도 자식 환경에서 뺀다
      - name: 환경 준비
        working-directory: academy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local
      - name: 시험
        if: ${{ inputs.mode == 'leak-test' || inputs.mode == 'draft-test' }}
        working-directory: academy
        env:
          SALES_MODE: ${{ inputs.mode }}
        run: node scripts/sales.mjs "--$SALES_MODE"
      - name: 영업 주간 (리포트 쓰기 · 초안)
        if: ${{ (inputs.mode || 'run') == 'run' }}
        working-directory: academy
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_DAILY_MAX: ${{ vars.CLAUDE_DAILY_MAX }}
        run: node scripts/sales.mjs
      - name: 공개본 커밋·푸시 (토큰은 여기만)
        if: ${{ (inputs.mode || 'run') == 'run' }}
        working-directory: academy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sales.mjs --push
