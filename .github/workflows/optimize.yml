# 매일 AI 추천 개선 루프 — 사람·세션 없이 돈다
#
# 전에는 병목 문장 하나를 DB 에 적고 실행은 Codex 예약에 맡겼다.
# Codex 한도가 끝나자 아무도 실행하지 않았다. 적기만 하는 담당은 담당이 아니다.
#
#   측정  승인 질문 20개를 제미나이(구글 검색 근거)·groq compound 에 묻고 답·출처 적재
#   루프  지난 행동 효과 판정 → 질문 하나 고르기 → 행동 실행(색인 알림·초안·출처 분석) → 원장
#
# 발행은 하지 않는다. 초안까지다. 발행되면 다음 날 루프가 알아채 판정 창을 연다.
#
# 필요한 시크릿: DATABASE_URL, LLM_PROXY_URL, LLM_PROXY_TOKEN — OpenRouter 키는 Vercel(geo)에만 있고 /api/llm 이 중계한다 (tools/set-llm-proxy.mjs)
# GEMINI_API_KEY·GROQ_API_KEY 는 무료 한도에 막혀 있다(2026-09-17). 있으면 시도만 한다
name: optimize

on:
  schedule:
    - cron: "5 22 * * *" # 07:05 KST — serp(07:41) 보다 앞
  workflow_dispatch: {}

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install pg --no-save --silent
        working-directory: academy

      # 원장 Max 구독으로 도는 Claude Code. API 크레딧 없이 측정·초안·분석을 한다(2026-09-22)
      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code@2.1.278 --silent  # 로컬에서 시험한 판. 올릴 때는 플래그·출력·한도 문구를 다시 본다

      - name: 환경 준비
        working-directory: academy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local

      # 한 엔진이 막혀도 루프는 돈다. 어제까지의 측정으로도 판정·행동은 할 수 있다
      - name: AI 답변 측정
        id: measure
        continue-on-error: true
        working-directory: academy
        env:
          LLM_PROXY_URL: ${{ secrets.LLM_PROXY_URL }}
          LLM_PROXY_TOKEN: ${{ secrets.LLM_PROXY_TOKEN }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 측정 몫·하루 상한. 비어 있으면 기본값(22·40). 원장이 올리면 저장소 변수만 바꾼다 (Step 25 D3)
          CLAUDE_MEASURE_RESERVE: ${{ vars.CLAUDE_MEASURE_RESERVE }}
          CLAUDE_DAILY_MAX: ${{ vars.CLAUDE_DAILY_MAX }}
          MEASURE_ENGINES: ${{ vars.MEASURE_ENGINES }}
          MEASURE_EVERY_DAYS: ${{ vars.MEASURE_EVERY_DAYS }}
          MEASURE_ANTHROPIC_MODEL: ${{ vars.MEASURE_ANTHROPIC_MODEL }}
          MEASURE_GEMINI_MODEL: ${{ vars.MEASURE_GEMINI_MODEL }}
          MEASURE_GROQ_MODEL: ${{ vars.MEASURE_GROQ_MODEL }}
        # 78 = 크레딧·키가 없어 건너뜀. 고장이 아니므로 빨간불을 내지 않는다
        run: |
          set +e
          node scripts/ai-measure.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "78" ]; then
            echo "::notice::크레딧이나 키가 없어 측정을 건너뜁니다."
            exit 0
          fi
          exit $code

      - name: 판정 · 고르기 · 행동
        working-directory: academy
        env:
          LLM_PROXY_URL: ${{ secrets.LLM_PROXY_URL }}
          LLM_PROXY_TOKEN: ${{ secrets.LLM_PROXY_TOKEN }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MEASURE_RESERVE: ${{ vars.CLAUDE_MEASURE_RESERVE }}
          CLAUDE_DAILY_MAX: ${{ vars.CLAUDE_DAILY_MAX }}
          WRITER_PROVIDER: ${{ vars.WRITER_PROVIDER }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
        run: node scripts/daily-agent.mjs

      # 측정이 실패했는데 루프가 어제 자료로 돌았으면 초록불로 끝난다. 그러면 아무도 안 본다
      - name: 측정 실패 표시
        if: steps.measure.outcome == 'failure' && steps.measure.outputs.code != '78'
        run: |
          echo "::error::AI 답변 측정이 실패했습니다. 'AI 답변 측정' 단계 로그를 보세요."
          exit 1
