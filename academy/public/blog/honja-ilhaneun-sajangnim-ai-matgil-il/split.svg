<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="1인 회사에서 AI 에게 맡긴 일, 도로 가져온 일, 처음부터 안 맡기는 일. 맡긴 일은 네이버 블로그 이관, 색인 알림, AI 답변 측정. 도로 가져온 일은 재료 없는 글 초안으로 9월 22일부터 이틀 동안 세 편을 버렸다. 안 맡기는 일은 발행 전 사실 확인, 손님에게 어떻게 알고 왔는지 묻기, 로그인과 캡차.">
  <rect width="1200" height="660" fill="#0B0F16"/>
  <style>
    text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
    .t{fill:#E8ECF2;font-size:30px;font-weight:800}
    .s{fill:#9AA4B2;font-size:20px}
    .b{fill:#E8ECF2;font-size:21px}
    .h{font-size:25px;font-weight:800}
    .m{font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:2px}
  </style>
  <text x="60" y="80" class="t">맡긴 일 · 도로 가져온 일 · 안 맡기는 일</text>
  <text x="60" y="116" class="s">1인 회사를 AI 역할 8개로 돌리며 나눈 선</text>

  <rect x="60" y="170" width="340" height="360" rx="18" fill="#3DD6C4" fill-opacity="0.10" stroke="#3DD6C4" stroke-width="2"/>
  <text x="88" y="212" class="m" fill="#3DD6C4">AI 가 함</text>
  <text x="88" y="256" class="h" fill="#3DD6C4">맡긴 일</text>
  <text x="88" y="306" class="b">블로그 글 네이버 이관</text>
  <text x="88" y="344" class="b">새 글 색인 알림</text>
  <text x="88" y="382" class="b">AI 답변 속 이름 측정</text>
  <text x="88" y="460" class="s">공통점: 매번 모양이 같고</text>
  <text x="88" y="488" class="s">맞는지 기계가 확인한다</text>

  <rect x="430" y="170" width="340" height="360" rx="18" fill="none" stroke="#F5A623" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="458" y="212" class="m" fill="#F5A623">되돌림</text>
  <text x="458" y="256" class="h" fill="#F5A623">도로 가져온 일</text>
  <text x="458" y="306" class="b">재료 없는 글 초안</text>
  <text x="458" y="344" class="b">9/22 두 편, 9/23 한 편 버림</text>
  <text x="458" y="460" class="s">이유: 일반론, 지어낸 장면</text>
  <text x="458" y="488" class="s">지금은 재료 없으면 안 씀</text>

  <rect x="800" y="170" width="340" height="360" rx="18" fill="#E8ECF2" fill-opacity="0.05" stroke="#9AA4B2" stroke-width="2"/>
  <text x="828" y="212" class="m" fill="#9AA4B2">사람이 함</text>
  <text x="828" y="256" class="h" fill="#E8ECF2">안 맡기는 일</text>
  <text x="828" y="306" class="b">발행 전 사실 확인</text>
  <text x="828" y="344" class="b">「어떻게 알고 오셨어요」</text>
  <text x="828" y="382" class="b">로그인 · 캡차</text>
  <text x="828" y="460" class="s">틀리면 신뢰·계정이</text>
  <text x="828" y="488" class="s">통째로 흔들리는 일</text>

  <text x="60" y="590" class="s">맡길 기준 셋: 모양이 매번 같은가 · 맞는지 확인할 방법이 있는가 · 틀려도 사람이 잡을 수 있는가</text>
  <text x="1140" y="632" class="m" fill="#5B6573" text-anchor="end">로봇&amp;코딩학원</text>
</svg>
