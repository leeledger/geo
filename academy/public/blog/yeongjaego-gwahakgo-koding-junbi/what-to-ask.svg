<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img"
     aria-label="영재고와 과학고 준비에서 가장 많이 놓치는 것은 과정 기록이다. 왜 이 주제를 골랐는지, 어디서 막혔고 무엇을 의심했고 어떻게 확인했는지, 처음 계획에서 무엇이 왜 바뀌었는지를 남겨야 한다. 학원을 고를 때 물어볼 세 가지는 대회 기출을 실제로 풀어 보는지, 아이가 만든 것의 과정이 기록으로 남는지, 4단계쯤 되면 몇 명씩 봐주는지이다.">
  <defs>
    <linearGradient id="wbg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
  </defs>
  <rect width="960" height="440" fill="url(#wbg2)"/>

  <text x="480" y="44" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="12" letter-spacing="2.5" fill="#8A94A6">가장 많이 놓치는 것</text>

  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <rect x="176" y="70" width="608" height="60" rx="10" fill="#1A1610" stroke="#8A6A22" stroke-width="1.6"/>
    <text x="480" y="108" text-anchor="middle" font-size="19" font-weight="800" fill="#F0D9A8">
      결과물은 있는데 과정 기록이 없습니다
    </text>

    <!-- 남겨야 할 셋 -->
    <rect x="56" y="158" width="272" height="112" rx="12" fill="#111C1B" stroke="#24413C"/>
    <text x="80" y="192" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#3DD6C4">01</text>
    <text x="80" y="222" font-size="16" font-weight="700" fill="#C9D6D3">왜 이 주제를</text>
    <text x="80" y="246" font-size="16" font-weight="700" fill="#C9D6D3">골랐는지</text>

    <rect x="344" y="158" width="272" height="112" rx="12" fill="#111C1B" stroke="#24413C"/>
    <text x="368" y="192" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#3DD6C4">02</text>
    <text x="368" y="222" font-size="16" font-weight="700" fill="#C9D6D3">어디서 막혔고</text>
    <text x="368" y="246" font-size="16" font-weight="700" fill="#C9D6D3">어떻게 확인했는지</text>

    <rect x="632" y="158" width="272" height="112" rx="12" fill="#111C1B" stroke="#24413C"/>
    <text x="656" y="192" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#3DD6C4">03</text>
    <text x="656" y="222" font-size="16" font-weight="700" fill="#C9D6D3">계획에서 무엇이</text>
    <text x="656" y="246" font-size="16" font-weight="700" fill="#C9D6D3">왜 바뀌었는지</text>
  </g>

  <!-- 학원 고를 때 -->
  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <text x="56" y="316" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="12" letter-spacing="2" fill="#6B7688">학원 상담에서 이 셋만 물어보세요</text>

    <rect x="56" y="330" width="848" height="42" rx="8" fill="#12181F" stroke="#2B3646"/>
    <text x="80" y="357" font-size="15" fill="#C6D2DE">대회 기출을 실제로 풀어 보나요?</text>

    <rect x="56" y="380" width="848" height="42" rx="8" fill="#12181F" stroke="#2B3646"/>
    <text x="80" y="407" font-size="15" fill="#C6D2DE">아이가 만든 것의 과정이 기록으로 남나요? 4단계쯤 되면 몇 명씩 봐주나요?</text>
  </g>
</svg>
