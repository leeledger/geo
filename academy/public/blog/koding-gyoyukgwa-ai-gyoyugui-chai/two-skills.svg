<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img"
     aria-label="코딩 교육은 시키는 법을, AI 교육은 무엇을 시킬지 정하는 법을 배운다는 대비. 왼쪽은 순서·반복·조건, 오른쪽은 무엇이 문제인가·무엇부터 푸는가·이 답이 맞는가.">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
  </defs>
  <rect width="960" height="440" fill="url(#bg2)"/>
  <g stroke="#1B2432" stroke-width="1" opacity=".5">
    <path d="M0 110h960M0 220h960M0 330h960"/>
  </g>

  <!-- 가운데 경계 -->
  <path d="M480 54v340" stroke="#232E3D" stroke-width="1.5"/>

  <!-- 왼쪽 : 코딩 교육 -->
  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <text x="64" y="76" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12"
          letter-spacing="2" fill="#F5A623" fill-opacity=".9">CODING</text>
    <text x="64" y="112" font-size="24" font-weight="800" fill="#E8EDF5" letter-spacing="-.5">코딩 교육</text>
    <text x="64" y="144" font-size="16" font-weight="700" fill="#F5A623">시키는 법을 배웁니다</text>

    <g>
      <rect x="64" y="176" width="352" height="52" rx="10" fill="#161E2A" stroke="#2B3646"/>
      <circle cx="94" cy="202" r="4.5" fill="#F5A623"/>
      <text x="116" y="208" font-size="15.5" fill="#C7D0DC">순서를 정한다</text>
    </g>
    <g>
      <rect x="64" y="238" width="352" height="52" rx="10" fill="#161E2A" stroke="#2B3646"/>
      <circle cx="94" cy="264" r="4.5" fill="#F5A623"/>
      <text x="116" y="270" font-size="15.5" fill="#C7D0DC">반복할 곳을 찾는다</text>
    </g>
    <g>
      <rect x="64" y="300" width="352" height="52" rx="10" fill="#161E2A" stroke="#2B3646"/>
      <circle cx="94" cy="326" r="4.5" fill="#F5A623"/>
      <text x="116" y="332" font-size="15.5" fill="#C7D0DC">조건을 나눈다</text>
    </g>

    <text x="64" y="388" font-size="13.5" fill="#7C8698">AI가 대신 써 줘도 없어지지 않습니다.</text>
    <text x="64" y="408" font-size="13.5" fill="#7C8698">틀린 코드에서 어디가 틀렸는지 아는 힘입니다.</text>
  </g>

  <!-- 오른쪽 : AI 교육 -->
  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <text x="544" y="76" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12"
          letter-spacing="2" fill="#3DD6C4" fill-opacity=".9">AI</text>
    <text x="544" y="112" font-size="24" font-weight="800" fill="#E8EDF5" letter-spacing="-.5">AI 교육</text>
    <text x="544" y="144" font-size="16" font-weight="700" fill="#3DD6C4">무엇을 시킬지 정하는 법을 배웁니다</text>

    <g>
      <rect x="544" y="176" width="352" height="52" rx="10" fill="#131F1E" stroke="#28453F"/>
      <circle cx="574" cy="202" r="4.5" fill="#3DD6C4"/>
      <text x="596" y="208" font-size="15.5" fill="#C7D0DC">지금 뭐가 문제인가</text>
    </g>
    <g>
      <rect x="544" y="238" width="352" height="52" rx="10" fill="#131F1E" stroke="#28453F"/>
      <circle cx="574" cy="264" r="4.5" fill="#3DD6C4"/>
      <text x="596" y="270" font-size="15.5" fill="#C7D0DC">그중에 무엇부터 푸는가</text>
    </g>
    <g>
      <rect x="544" y="300" width="352" height="52" rx="10" fill="#131F1E" stroke="#28453F"/>
      <circle cx="574" cy="326" r="4.5" fill="#3DD6C4"/>
      <text x="596" y="332" font-size="15.5" fill="#C7D0DC">나온 답이 맞는가</text>
    </g>

    <text x="544" y="388" font-size="13.5" fill="#7C8698">문법을 아무리 외워도 따라오지 않습니다.</text>
    <text x="544" y="408" font-size="13.5" fill="#7C8698">문제를 스스로 정의해 본 적이 있어야 생깁니다.</text>
  </g>
</svg>
