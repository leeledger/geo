<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img"
     aria-label="코딩학원과 온라인 강의 중 무엇이 맞는지 판단하는 기준. 아이가 시키지 않아도 강의를 열어보면 온라인으로 충분하고, 매번 시켜야 하면 아직 사람이 필요하다. 섞어 쓸 수도 있다. 학원에서 막히는 지점을 뚫고 온라인으로 반복 연습하거나, 방학에 온라인으로 앞서 나가고 학기 중에 학원에서 정리한다.">
  <defs>
    <linearGradient id="obg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
  </defs>
  <rect width="960" height="440" fill="url(#obg)"/>

  <text x="480" y="46" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="12" letter-spacing="2.5" fill="#8A94A6">판단 기준은 하나입니다</text>

  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <rect x="216" y="76" width="528" height="60" rx="10" fill="#12181F" stroke="#2B3646"/>
    <text x="480" y="114" text-anchor="middle" font-size="18" font-weight="700" fill="#E8EDF2">
      지난주에 아이가 스스로 강의를 열었나요?
    </text>

    <path d="M400 136 v26 h-118 v20" fill="none" stroke="#24413C" stroke-width="1.6"/>
    <path d="M276 176 l6 8 l6 -8" fill="none" stroke="#24413C" stroke-width="1.6"/>
    <path d="M560 136 v26 h118 v20" fill="none" stroke="#4A3A18" stroke-width="1.6"/>
    <path d="M672 176 l6 8 l6 -8" fill="none" stroke="#4A3A18" stroke-width="1.6"/>

    <rect x="56" y="184" width="452" height="104" rx="12" fill="#111C1B" stroke="#24413C"/>
    <text x="80" y="220" font-size="19" font-weight="800" fill="#3DD6C4">열었다</text>
    <text x="80" y="252" font-size="15" fill="#C9D6D3">온라인으로 충분합니다.</text>
    <text x="80" y="276" font-size="14" fill="#68796F">스스로 여는 아이는 혼자서도 나아갑니다</text>

    <rect x="524" y="184" width="380" height="104" rx="12" fill="#1A1610" stroke="#4A3A18"/>
    <text x="548" y="220" font-size="19" font-weight="800" fill="#F5A623">매번 시켜야 했다</text>
    <text x="548" y="252" font-size="15" fill="#F0D9A8">아직 사람이 필요합니다.</text>
    <text x="548" y="276" font-size="14" fill="#7A6B4E">막힌 자리를 옆에서 짚어 줘야 넘어갑니다</text>
  </g>

  <!-- 섞어 쓰기 -->
  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <rect x="56" y="316" width="848" height="82" rx="12" fill="#101820" stroke="#233240"/>
    <text x="80" y="348" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="12" letter-spacing="2" fill="#6FA8C7">섞어 쓰는 방법</text>
    <text x="80" y="374" font-size="14.5" fill="#9AA7B5">학원에서 막히는 지점을 뚫고, 온라인으로 반복 연습합니다.</text>
    <text x="524" y="374" font-size="14.5" fill="#9AA7B5">방학엔 온라인으로 앞서 나가고, 학기 중엔 학원에서 정리합니다.</text>
  </g>
</svg>
