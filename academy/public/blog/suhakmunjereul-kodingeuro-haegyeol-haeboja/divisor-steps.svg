<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img"
     aria-label="약수 구하기를 코딩으로 옮긴 네 단계. 입력이 12일 때를 예로 든다. 1 입력, 숫자 12를 넣는다. 2 반복, 1부터 12까지 하나씩 나눠 본다. 3 조건, 나머지가 0인 수만 리스트에 담는다. 4 출력, 리스트를 보여준다. 결과는 1, 2, 3, 4, 6, 12. 숫자를 키우면, 소수를 넣으면 어떻게 되는지 직접 돌려 보며 알게 된다.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
  </defs>
  <rect width="960" height="380" fill="url(#gbg)"/>

  <text x="480" y="44" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="12" letter-spacing="2.5" fill="#8A94A6">약수 구하기를 코딩으로 · 입력이 12일 때</text>

  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <!-- 1 입력 -->
    <rect x="52" y="84" width="196" height="200" rx="12" fill="#12181F" stroke="#232C38"/>
    <text x="150" y="116" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="12" letter-spacing="2" fill="#F5A623">1 · 입력</text>
    <text x="150" y="160" text-anchor="middle" font-size="18" font-weight="800" fill="#E6EAF0">숫자를 넣는다</text>
    <rect x="80" y="210" width="140" height="44" rx="8" fill="#0B0F16" stroke="#232C38"/>
    <text x="150" y="238" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="16" fill="#C9D1DC">12</text>

    <path d="M254 184 h14" stroke="#2B3646" stroke-width="1.6"/>
    <path d="M262 178 l8 6 l-8 6" fill="none" stroke="#3DD6C4" stroke-width="1.8"/>

    <!-- 2 반복 -->
    <rect x="272" y="84" width="196" height="200" rx="12" fill="#12181F" stroke="#232C38"/>
    <text x="370" y="116" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="12" letter-spacing="2" fill="#F5A623">2 · 반복</text>
    <text x="370" y="156" text-anchor="middle" font-size="18" font-weight="800" fill="#E6EAF0">1부터 12까지</text>
    <text x="370" y="182" text-anchor="middle" font-size="18" font-weight="800" fill="#E6EAF0">하나씩 나눠 본다</text>
    <rect x="292" y="210" width="156" height="44" rx="8" fill="#0B0F16" stroke="#232C38"/>
    <text x="370" y="238" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="13" fill="#C9D1DC">12÷1 … 12÷12</text>

    <path d="M474 184 h14" stroke="#2B3646" stroke-width="1.6"/>
    <path d="M482 178 l8 6 l-8 6" fill="none" stroke="#3DD6C4" stroke-width="1.8"/>

    <!-- 3 조건 -->
    <rect x="492" y="84" width="196" height="200" rx="12" fill="#12181F" stroke="#232C38"/>
    <text x="590" y="116" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="12" letter-spacing="2" fill="#F5A623">3 · 조건</text>
    <text x="590" y="156" text-anchor="middle" font-size="18" font-weight="800" fill="#E6EAF0">나머지가 0이면</text>
    <text x="590" y="182" text-anchor="middle" font-size="18" font-weight="800" fill="#E6EAF0">리스트에 담는다</text>
    <rect x="512" y="210" width="156" height="44" rx="8" fill="#0B0F16" stroke="#232C38"/>
    <text x="590" y="238" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="13" fill="#C9D1DC">12÷5 → 나머지 2</text>

    <path d="M694 184 h14" stroke="#2B3646" stroke-width="1.6"/>
    <path d="M702 178 l8 6 l-8 6" fill="none" stroke="#3DD6C4" stroke-width="1.8"/>

    <!-- 4 출력 -->
    <rect x="712" y="84" width="196" height="200" rx="12" fill="#111C1B" stroke="#24413C"/>
    <text x="810" y="116" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="12" letter-spacing="2" fill="#3DD6C4">4 · 출력</text>
    <text x="810" y="160" text-anchor="middle" font-size="18" font-weight="800" fill="#DDEDE9">리스트를 보여준다</text>
    <rect x="732" y="210" width="156" height="44" rx="8" fill="#0B0F16" stroke="#24413C"/>
    <text x="810" y="238" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="15" fill="#3DD6C4">1 2 3 4 6 12</text>
  </g>

  <text x="480" y="332" text-anchor="middle" font-family="'Noto Sans KR',system-ui,sans-serif"
        font-size="14" fill="#8A94A6">숫자를 키우면? 소수를 넣으면? 노트 대신 직접 돌려 보며 알게 된다</text>
</svg>
