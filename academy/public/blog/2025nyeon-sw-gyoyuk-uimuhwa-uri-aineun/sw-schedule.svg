<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img"
     aria-label="SW 교육 의무화 일정. 2025년부터 중학교 코딩 수업 필수화, 2026년부터 초등학교 코딩 수업 확대, 수업 시수 2배 증가와 평가 포함. 학교 수업만으로 충분한지는 학교마다 다르다.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#F5A623" stop-opacity="0.14"/><stop offset="1" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DD6C4"/><stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18202C"/><stop offset="1" stop-color="#121821"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2013"/><stop offset="1" stop-color="#1A150E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="960" height="460" fill="url(#bg)"/>
  <rect width="960" height="460" fill="url(#glow)"/>

  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <text x="56" y="62" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="2.5" fill="#3DD6C4">SW 교육 의무화 · 일정</text>
    <text x="56" y="100" font-size="30" font-weight="800" fill="#F1F4F8">중학교가 먼저, 초등학교가 뒤따른다</text>
    <text x="56" y="130" font-size="15" fill="#8A94A6">수업 시수 2배 · 평가까지 포함</text>

    <rect x="150" y="176" width="660" height="4" rx="2" fill="url(#rail)"/>

    <g transform="translate(150,178)">
      <circle r="26" fill="#0E1A1C" stroke="#3DD6C4" stroke-width="2.5"/>
      <!-- 교복 학교 -->
      <path d="M-12 10 v-12 l12 -8 l12 8 v12 z M-4 10 v-7 h8 v7" fill="none" stroke="#3DD6C4" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <g transform="translate(810,178)">
      <circle r="32" fill="#F5A623" opacity="0.14"/>
      <circle r="26" fill="#241A0C" stroke="#F5A623" stroke-width="3"/>
      <!-- 연필 -->
      <path d="M-11 11 l3 -9 l13 -13 l6 6 l-13 13 z M-8 2 l6 6" fill="none" stroke="#F5A623" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="44" y="232" width="400" height="136" rx="14" fill="url(#card)" stroke="#263241"/>
      <rect x="516" y="232" width="400" height="136" rx="14" fill="url(#hot)" stroke="#6A4A17"/>
    </g>
    <text x="68" y="266" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" fill="#3DD6C4">2025년부터</text>
    <text x="68" y="302" font-size="22" font-weight="800" fill="#EEF2F6">중학교 코딩 수업 필수화</text>
    <text x="68" y="334" font-size="14" fill="#9AA5B5">정규 과목으로 편성</text>

    <text x="540" y="266" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" fill="#F5A623">2026년부터</text>
    <text x="540" y="302" font-size="22" font-weight="800" fill="#FFF3DE">초등학교 코딩 수업 확대</text>
    <text x="540" y="334" font-size="14" fill="#C9A97A">학교 코딩 수업이 넓어진다</text>

    <rect x="44" y="392" width="872" height="44" rx="12" fill="#141B25" stroke="#2A3544"/>
    <text x="68" y="420" font-size="14" fill="#DCE3EC"><tspan fill="#3DD6C4" font-weight="700">확인할 것</tspan>  우리 아이 학교에서 실제로 몇 시간을 편성했는지는 학교마다 다르다</text>
  </g>
</svg>
