<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img"
     aria-label="아이가 가져온 숙제를 놓고 3분, 세 가지만 묻는다. 검사가 아니라 대화로. 이거 나한테 설명해 줄래 하고 물으면 스스로 한 아이는 끝까지 설명하고, 받아 적은 아이는 두 번째 문장에서 막힌다. 이 부분은 왜 이렇게 썼어 하고 물으면 스스로 한 아이는 고른 이유를 대고, 받아 적은 아이는 이유를 못 댄다. AI가 틀린 데는 없었어 하고 물으면 스스로 한 아이는 틀린 데를 짚고, 받아 적은 아이는 몰라요라고 한다. 기준은 AI를 썼는지가 아니라 설명할 수 있는지다.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#3DD6C4" stop-opacity="0.13"/><stop offset="1" stop-color="#3DD6C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18202C"/><stop offset="1" stop-color="#121821"/>
    </linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12302C"/><stop offset="1" stop-color="#0E1F1D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="960" height="580" fill="url(#bg)"/>
  <rect width="960" height="580" fill="url(#glow)"/>

  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <text x="56" y="60" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="2.5" fill="#3DD6C4">숙제를 놓고 · 3분 · 세 가지만</text>
    <text x="56" y="98" font-size="30" font-weight="800" fill="#F1F4F8">AI를 썼는지가 아니라, 설명할 수 있는지</text>
    <text x="56" y="128" font-size="15" fill="#8A94A6">검사가 아니라 대화로 묻는다</text>

    <!-- 열 머리 -->
    <g transform="translate(596,168)">
      <circle r="11" fill="none" stroke="#3DD6C4" stroke-width="2"/>
      <path d="M-5 0 l3.5 3.5 l6.5 -7" fill="none" stroke="#3DD6C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="614" y="173" font-size="14" font-weight="700" fill="#3DD6C4">스스로 한 아이</text>
    <g transform="translate(786,168)">
      <circle r="11" fill="none" stroke="#6E7A8C" stroke-width="2"/>
      <path d="M-4 -4 l8 8 M4 -4 l-8 8" stroke="#6E7A8C" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="804" y="173" font-size="14" font-weight="700" fill="#8A94A6">받아 적은 아이</text>

    <!-- 행 1 -->
    <g filter="url(#shadow)">
      <rect x="44" y="194" width="528" height="102" rx="14" fill="url(#card)" stroke="#263241"/>
      <rect x="584" y="194" width="176" height="102" rx="14" fill="url(#good)" stroke="#24514A"/>
      <rect x="772" y="194" width="144" height="102" rx="14" fill="#11161E" stroke="#232C38"/>
    </g>
    <g transform="translate(90,245)">
      <circle r="22" fill="#0E1A1C" stroke="#3DD6C4" stroke-width="2"/>
      <path d="M-11 -7 h22 v12 h-10 l-6 6 v-6 h-6 z" fill="none" stroke="#3DD6C4" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <text x="128" y="236" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#5D6878">질문 1</text>
    <text x="128" y="264" font-size="20" font-weight="800" fill="#F1F4F8">“이거 나한테 설명해 줄래?”</text>
    <text x="604" y="238" font-size="15.5" font-weight="700" fill="#DDF5F0">끝까지 설명한다</text>
    <text x="604" y="264" font-size="12.5" fill="#7FB8AE">자기가 정했다</text>
    <text x="792" y="238" font-size="15" font-weight="700" fill="#7B8594">두 번째 문장</text>
    <text x="792" y="258" font-size="15" font-weight="700" fill="#7B8594">에서 막힌다</text>

    <!-- 행 2 -->
    <g filter="url(#shadow)">
      <rect x="44" y="310" width="528" height="102" rx="14" fill="url(#card)" stroke="#263241"/>
      <rect x="584" y="310" width="176" height="102" rx="14" fill="url(#good)" stroke="#24514A"/>
      <rect x="772" y="310" width="144" height="102" rx="14" fill="#11161E" stroke="#232C38"/>
    </g>
    <g transform="translate(90,361)">
      <circle r="22" fill="#0E1A1C" stroke="#3DD6C4" stroke-width="2"/>
      <!-- 물음표 -->
      <path d="M-5 -6 q0 -7 6 -7 q6 0 6 6 q0 4 -6 6 v3" fill="none" stroke="#3DD6C4" stroke-width="2" stroke-linecap="round"/>
      <circle cx="1" cy="9" r="1.6" fill="#3DD6C4"/>
    </g>
    <text x="128" y="352" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#5D6878">질문 2</text>
    <text x="128" y="380" font-size="20" font-weight="800" fill="#F1F4F8">“이 부분은 왜 이렇게 썼어?”</text>
    <text x="604" y="354" font-size="15.5" font-weight="700" fill="#DDF5F0">고른 이유를 댄다</text>
    <text x="604" y="380" font-size="12.5" fill="#7FB8AE">스스로 판단했다</text>
    <text x="792" y="354" font-size="15" font-weight="700" fill="#7B8594">이유를</text>
    <text x="792" y="374" font-size="15" font-weight="700" fill="#7B8594">못 댄다</text>

    <!-- 행 3 -->
    <g filter="url(#shadow)">
      <rect x="44" y="426" width="528" height="102" rx="14" fill="url(#card)" stroke="#263241"/>
      <rect x="584" y="426" width="176" height="102" rx="14" fill="url(#good)" stroke="#24514A"/>
      <rect x="772" y="426" width="144" height="102" rx="14" fill="#11161E" stroke="#232C38"/>
    </g>
    <g transform="translate(90,477)">
      <circle r="22" fill="#0E1A1C" stroke="#3DD6C4" stroke-width="2"/>
      <!-- 돋보기 -->
      <circle cx="-3" cy="-3" r="7" fill="none" stroke="#3DD6C4" stroke-width="2"/>
      <path d="M2 2 l7 7" stroke="#3DD6C4" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <text x="128" y="468" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#5D6878">질문 3</text>
    <text x="128" y="496" font-size="20" font-weight="800" fill="#F1F4F8">“AI가 틀린 데는 없었어?”</text>
    <text x="604" y="470" font-size="15.5" font-weight="700" fill="#DDF5F0">틀린 데를 짚는다</text>
    <text x="604" y="496" font-size="12.5" fill="#7FB8AE">검토를 했다</text>
    <text x="792" y="470" font-size="15" font-weight="700" fill="#7B8594">“몰라요”</text>
    <text x="792" y="496" font-size="12.5" fill="#5D6878">그대로 냈다</text>
  </g>

  <text x="480" y="560" text-anchor="middle" font-family="'Noto Sans KR',system-ui,sans-serif" font-size="13.5" fill="#8A94A6">설명이 되면 도구를 쓴 것이고, 설명이 안 되면 대신 시킨 것이다</text>
</svg>
