<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img"
     aria-label="아이가 가져온 숙제를 놓고 묻는 세 가지 질문. 이거 나한테 설명해 줄래 하고 물으면 스스로 한 아이는 끝까지 설명하고, 받아 적은 아이는 두 번째 문장에서 막힌다. 이 부분은 왜 이렇게 썼어 하고 물으면 판단한 아이는 고른 이유를 대고, 받아 적은 아이는 이유를 못 댄다. AI가 틀린 데는 없었어 하고 물으면 검토한 아이는 틀린 데를 짚고, 그대로 낸 아이는 몰라요라고 한다. 기준은 AI를 썼는지가 아니라 설명할 수 있는지다.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
  </defs>
  <rect width="960" height="500" fill="url(#gbg)"/>

  <text x="480" y="44" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="12" letter-spacing="2.5" fill="#8A94A6">숙제를 놓고 세 가지만 · 3분</text>

  <g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="2">
    <text x="76" y="96" fill="#4E5867">묻는 말</text>
    <text x="588" y="96" text-anchor="middle" fill="#3DD6C4">스스로 한 아이</text>
    <text x="810" y="96" text-anchor="middle" fill="#4E5867">받아 적은 아이</text>
  </g>

  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <!-- 1 -->
    <rect x="56" y="116" width="400" height="96" rx="12" fill="#12181F" stroke="#232C38"/>
    <text x="80" y="170" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" fill="#F5A623">1</text>
    <text x="108" y="171" font-size="19" font-weight="800" fill="#E6EAF0">“이거 나한테 설명해 줄래?”</text>
    <rect x="476" y="116" width="224" height="96" rx="12" fill="#111C1B" stroke="#24413C"/>
    <text x="588" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#DDEDE9">끝까지 설명한다</text>
    <text x="588" y="184" text-anchor="middle" font-size="13" fill="#7FA79F">자기가 정했다</text>
    <rect x="716" y="116" width="188" height="96" rx="12" fill="#12181F" stroke="#232C38"/>
    <text x="810" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#5D6878">두 번째 문장에서</text>
    <text x="810" y="184" text-anchor="middle" font-size="13" fill="#4E5867">막힌다</text>

    <!-- 2 -->
    <rect x="56" y="228" width="400" height="96" rx="12" fill="#12181F" stroke="#232C38"/>
    <text x="80" y="282" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" fill="#F5A623">2</text>
    <text x="108" y="283" font-size="19" font-weight="800" fill="#E6EAF0">“이 부분은 왜 이렇게 썼어?”</text>
    <rect x="476" y="228" width="224" height="96" rx="12" fill="#111C1B" stroke="#24413C"/>
    <text x="588" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#DDEDE9">고른 이유를 댄다</text>
    <text x="588" y="296" text-anchor="middle" font-size="13" fill="#7FA79F">스스로 판단했다</text>
    <rect x="716" y="228" width="188" height="96" rx="12" fill="#12181F" stroke="#232C38"/>
    <text x="810" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#5D6878">이유를 못 댄다</text>
    <text x="810" y="296" text-anchor="middle" font-size="13" fill="#4E5867">고른 적이 없다</text>

    <!-- 3 -->
    <rect x="56" y="340" width="400" height="96" rx="12" fill="#12181F" stroke="#232C38"/>
    <text x="80" y="394" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" fill="#F5A623">3</text>
    <text x="108" y="395" font-size="19" font-weight="800" fill="#E6EAF0">“AI가 틀린 데는 없었어?”</text>
    <rect x="476" y="340" width="224" height="96" rx="12" fill="#111C1B" stroke="#24413C"/>
    <text x="588" y="382" text-anchor="middle" font-size="16" font-weight="700" fill="#DDEDE9">틀린 데를 짚는다</text>
    <text x="588" y="408" text-anchor="middle" font-size="13" fill="#7FA79F">검토를 했다</text>
    <rect x="716" y="340" width="188" height="96" rx="12" fill="#12181F" stroke="#232C38"/>
    <text x="810" y="382" text-anchor="middle" font-size="16" font-weight="700" fill="#5D6878">“몰라요”</text>
    <text x="810" y="408" text-anchor="middle" font-size="13" fill="#4E5867">그대로 냈다</text>
  </g>

  <text x="480" y="474" text-anchor="middle" font-family="'Noto Sans KR',system-ui,sans-serif"
        font-size="14" fill="#8A94A6">검사가 아니라 대화로 묻는다 · 기준은 AI를 썼는지가 아니라 설명할 수 있는지</text>
</svg>
