<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img"
     aria-label="AI를 같이 쓸 때 순서를 바꾼다. 첫째, 아이가 자기 생각을 세 줄이라도 먼저 적는다. 둘째, 같은 질문을 AI에게 묻는다. 셋째, 둘을 비교해서 무엇이 달랐는지 보고 고친다. 이 순서면 AI는 답을 주는 도구가 아니라 자기 생각을 확인하는 도구가 되고, 무엇을 물었고 무엇을 고쳤는지 기록이 남는다.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
  </defs>
  <rect width="960" height="340" fill="url(#gbg)"/>

  <text x="480" y="44" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="12" letter-spacing="2.5" fill="#8A94A6">같이 쓸 때는 순서를 바꾼다</text>

  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <!-- 1 아이 먼저 -->
    <rect x="56" y="96" width="256" height="140" rx="12" fill="#1C1710" stroke="#4A3A1E"/>
    <text x="184" y="130" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="12" letter-spacing="2" fill="#F5A623">1 · 아이 먼저</text>
    <text x="184" y="172" text-anchor="middle" font-size="22" font-weight="800" fill="#F3E6CF">내 생각을 적는다</text>
    <text x="184" y="204" text-anchor="middle" font-size="13" fill="#A8977A">세 줄이라도</text>

    <path d="M320 166 h24" stroke="#2B3646" stroke-width="1.6" stroke-dasharray="4 5"/>
    <path d="M336 160 l10 6 l-10 6" fill="none" stroke="#3DD6C4" stroke-width="1.8"/>

    <!-- 2 -->
    <rect x="352" y="96" width="256" height="140" rx="12" fill="#12181F" stroke="#232C38"/>
    <text x="480" y="130" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="12" letter-spacing="2" fill="#8A94A6">2 · 그다음</text>
    <text x="480" y="172" text-anchor="middle" font-size="22" font-weight="800" fill="#E6EAF0">AI에게 묻는다</text>
    <text x="480" y="204" text-anchor="middle" font-size="13" fill="#8A94A6">같은 질문을 넣어 본다</text>

    <path d="M616 166 h24" stroke="#2B3646" stroke-width="1.6" stroke-dasharray="4 5"/>
    <path d="M632 160 l10 6 l-10 6" fill="none" stroke="#3DD6C4" stroke-width="1.8"/>

    <!-- 3 -->
    <rect x="648" y="96" width="256" height="140" rx="12" fill="#111C1B" stroke="#24413C"/>
    <text x="776" y="130" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="12" letter-spacing="2" fill="#3DD6C4">3 · 마지막</text>
    <text x="776" y="172" text-anchor="middle" font-size="22" font-weight="800" fill="#DDEDE9">둘을 비교한다</text>
    <text x="776" y="204" text-anchor="middle" font-size="13" fill="#7FA79F">무엇이 달랐는지 보고 고친다</text>
  </g>

  <text x="480" y="282" text-anchor="middle" font-family="'Noto Sans KR',system-ui,sans-serif"
        font-size="15" fill="#C9D1DC">AI가 답을 주는 도구가 아니라, 자기 생각을 확인하는 도구가 된다</text>
  <text x="480" y="308" text-anchor="middle" font-family="'Noto Sans KR',system-ui,sans-serif"
        font-size="13" fill="#8A94A6">무엇을 물었고 무엇을 고쳤는지 기록이 남는다</text>
</svg>
