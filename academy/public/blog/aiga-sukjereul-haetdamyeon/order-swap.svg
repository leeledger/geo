<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img"
     aria-label="AI를 같이 쓸 때는 순서를 바꾼다. 첫째, 아이가 먼저 자기 생각을 세 줄이라도 적는다. 둘째, 그다음 AI에게 같은 질문을 묻는다. 셋째, 마지막에 둘을 비교해 무엇이 달랐는지 보고 고친다. 이 순서면 AI가 답을 주는 도구가 아니라 자기 생각을 확인하는 도구가 되고, 무엇을 물었고 무엇을 고쳤는지 기록이 남는다.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5A623" stop-opacity="0.13"/><stop offset="1" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18202C"/><stop offset="1" stop-color="#121821"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2013"/><stop offset="1" stop-color="#1A150E"/>
    </linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12302C"/><stop offset="1" stop-color="#0E1F1D"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A623"/><stop offset="1" stop-color="#3DD6C4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="url(#bg)"/>
  <rect width="960" height="480" fill="url(#glow)"/>

  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <text x="56" y="60" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="2.5" fill="#3DD6C4">같이 쓸 때</text>
    <text x="56" y="98" font-size="30" font-weight="800" fill="#F1F4F8">순서 하나만 바꾼다 — 아이가 먼저</text>

    <g filter="url(#shadow)">
      <rect x="44" y="136" width="264" height="214" rx="16" fill="url(#hot)" stroke="#8A5E1A" stroke-width="1.5"/>
      <rect x="348" y="136" width="264" height="214" rx="16" fill="url(#card)" stroke="#263241"/>
      <rect x="652" y="136" width="264" height="214" rx="16" fill="url(#good)" stroke="#24514A"/>
    </g>

    <!-- 1 -->
    <rect x="224" y="152" width="68" height="24" rx="12" fill="#F5A623"/>
    <text x="258" y="169" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1A140C">아이 먼저</text>
    <g transform="translate(92,196)">
      <circle r="26" fill="#241A0C" stroke="#F5A623" stroke-width="2.5"/>
      <path d="M-11 11 l3 -9 l13 -13 l6 6 l-13 13 z M-8 2 l6 6" fill="none" stroke="#F5A623" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <text x="68" y="258" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#C9A97A">1 · 처음</text>
    <text x="68" y="290" font-size="21" font-weight="800" fill="#FFF3DE">내 생각을 적는다</text>
    <text x="68" y="318" font-size="14" fill="#C9A97A">세 줄이라도</text>

    <!-- 화살표 1 -->
    <path d="M314 243 h28" stroke="url(#arrow)" stroke-width="3" stroke-linecap="round"/>
    <path d="M334 236 l9 7 l-9 7" fill="none" stroke="#9FC3A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 2 -->
    <g transform="translate(396,196)">
      <circle r="26" fill="#141B25" stroke="#8A94A6" stroke-width="2.5"/>
      <path d="M-12 -8 h24 v14 h-11 l-7 6 v-6 h-6 z" fill="none" stroke="#C9D1DC" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="-5" cy="-1" r="1.5" fill="#C9D1DC"/><circle cx="0" cy="-1" r="1.5" fill="#C9D1DC"/><circle cx="5" cy="-1" r="1.5" fill="#C9D1DC"/>
    </g>
    <text x="372" y="258" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#8A94A6">2 · 그다음</text>
    <text x="372" y="290" font-size="21" font-weight="800" fill="#EEF2F6">AI에게 묻는다</text>
    <text x="372" y="318" font-size="14" fill="#9AA5B5">같은 질문을 넣어 본다</text>

    <!-- 화살표 2 -->
    <path d="M618 243 h28" stroke="url(#arrow)" stroke-width="3" stroke-linecap="round"/>
    <path d="M638 236 l9 7 l-9 7" fill="none" stroke="#3DD6C4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3 -->
    <g transform="translate(700,196)">
      <circle r="26" fill="#0E1A1C" stroke="#3DD6C4" stroke-width="2.5"/>
      <!-- 저울 -->
      <path d="M0 -13 v24 M-8 11 h16 M-13 -7 h26" stroke="#3DD6C4" stroke-width="2" stroke-linecap="round"/>
      <path d="M-13 -7 l-5 10 h10 z M13 -7 l-5 10 h10 z" fill="none" stroke="#3DD6C4" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <text x="676" y="258" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#3DD6C4">3 · 마지막</text>
    <text x="676" y="290" font-size="21" font-weight="800" fill="#DDF5F0">둘을 비교한다</text>
    <text x="676" y="318" font-size="14" fill="#7FB8AE">무엇이 달랐는지 보고 고친다</text>
  </g>

  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <rect x="44" y="374" width="872" height="80" rx="14" fill="#141B25" stroke="#2A3544"/>
    <text x="68" y="406" font-size="16" font-weight="700" fill="#EEF2F6">AI가 답을 주는 도구가 아니라, <tspan fill="#3DD6C4">자기 생각을 확인하는 도구</tspan>가 된다</text>
    <text x="68" y="434" font-size="13.5" fill="#8A94A6">무엇을 물었고 무엇을 고쳤는지 기록이 남는다 — 나중에 설명해야 할 때 꺼낼 것이 생긴다</text>
  </g>
</svg>
