<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img"
     aria-label="규모 요약. 만든 기간 5개월, 고친 횟수 1148번, 코드 85067줄, 옮긴 데이터 66094행, 이관 시도 4회.">
  <defs>
    <linearGradient id="nbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
  </defs>
  <rect width="960" height="340" fill="url(#nbg)"/>
  <g stroke="#1A2230" stroke-width="1" opacity=".8">
    <path d="M0 92h960M0 250h960"/>
  </g>

  <text x="56" y="56" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12"
        letter-spacing="2" fill="#F5A623" fill-opacity=".9">실제 납품 · 저장소에서 잰 수치</text>

  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <g>
      <text x="56" y="168" font-family="'IBM Plex Mono',monospace" font-size="46" font-weight="500" fill="#E8EDF5">5</text>
      <text x="92" y="168" font-size="19" fill="#8A94A6">개월</text>
      <text x="56" y="200" font-size="14" fill="#7C8698">만든 기간</text>
    </g>
    <g>
      <text x="222" y="168" font-family="'IBM Plex Mono',monospace" font-size="46" font-weight="500" fill="#E8EDF5">1,148</text>
      <text x="358" y="168" font-size="19" fill="#8A94A6">번</text>
      <text x="222" y="200" font-size="14" fill="#7C8698">고친 횟수</text>
    </g>
    <g>
      <text x="440" y="168" font-family="'IBM Plex Mono',monospace" font-size="46" font-weight="500" fill="#E8EDF5">85,067</text>
      <text x="602" y="168" font-size="19" fill="#8A94A6">줄</text>
      <text x="440" y="200" font-size="14" fill="#7C8698">쓴 코드</text>
    </g>
    <g>
      <text x="690" y="168" font-family="'IBM Plex Mono',monospace" font-size="46" font-weight="500" fill="#E8EDF5">66,094</text>
      <text x="852" y="168" font-size="19" fill="#8A94A6">줄</text>
      <text x="690" y="200" font-size="14" fill="#7C8698">옮길 옛 데이터</text>
    </g>
  </g>

  <!-- 이 글의 요지가 되는 숫자는 따로 세운다 -->
  <g>
    <rect x="56" y="278" width="228" height="40" rx="9" fill="#241B0C" stroke="#F5A623" stroke-opacity=".5"/>
    <text x="76" y="304" font-family="'IBM Plex Mono',monospace" font-size="22" font-weight="500" fill="#F5A623">4</text>
    <text x="96" y="304" font-family="'Noto Sans KR',system-ui,sans-serif" font-size="15" fill="#F5A623">번</text>
    <text x="128" y="304" font-family="'Noto Sans KR',system-ui,sans-serif" font-size="14.5" fill="#C9A05A">데이터 이관 시도</text>
  </g>
  <text x="308" y="304" font-family="'Noto Sans KR',system-ui,sans-serif" font-size="14.5" fill="#7C8698">
    코드는 AI가 썼습니다. 막힌 자리는 코드가 아니었습니다.
  </text>
