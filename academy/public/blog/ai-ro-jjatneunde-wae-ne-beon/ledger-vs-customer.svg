<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img"
     aria-label="옛 프로그램은 판매 장부만 있었다. 같은 사람이 살 때마다 한 줄씩 쌓이고 사람을 묶어 주는 번호가 없다. 새 시스템은 고객이 먼저 있고 주문이 거기 붙는다.">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
  </defs>
  <rect width="960" height="470" fill="url(#lbg)"/>

  <!-- ── 왼쪽 : 옛 장부 ── -->
  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <text x="48" y="52" font-family="'IBM Plex Mono',monospace" font-size="11.5"
          letter-spacing="2" fill="#8A94A6">BEFORE</text>
    <text x="48" y="84" font-size="20" font-weight="800" fill="#E8EDF5">판매 장부만 있었습니다</text>
    <text x="48" y="110" font-size="13.5" fill="#7C8698">한 줄이 거래 하나. 사람을 묶어 주는 번호가 없습니다.</text>

    <g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13">
      <rect x="48" y="132" width="360" height="30" fill="#161E2A"/>
      <text x="62" y="152" fill="#6E7887">날짜</text>
      <text x="140" y="152" fill="#6E7887">이름</text>
      <text x="250" y="152" fill="#6E7887">품목</text>
      <text x="340" y="152" fill="#6E7887">금액</text>

      <g fill="#C7D0DC">
        <rect x="48" y="162" width="360" height="30" fill="#131924"/>
        <text x="62" y="182">03-14</text><text x="140" y="182">홍길동</text><text x="250" y="182">A</text><text x="340" y="182">42,000</text>

        <rect x="48" y="192" width="360" height="30" fill="#161E2A"/>
        <text x="62" y="212">05-02</text><text x="140" y="212" fill="#F5A623">홍길동 상호</text><text x="250" y="212">B</text><text x="340" y="212">18,000</text>

        <rect x="48" y="222" width="360" height="30" fill="#131924"/>
        <text x="62" y="242">07-21</text><text x="140" y="242" fill="#F5A623">홍길동(메모)</text><text x="250" y="242">A</text><text x="340" y="242">42,000</text>

        <rect x="48" y="252" width="360" height="30" fill="#161E2A"/>
        <text x="62" y="272">08-09</text><text x="140" y="272" fill="#6E7887">(빈칸)</text><text x="250" y="272">C</text><text x="340" y="272">9,000</text>

        <rect x="48" y="282" width="360" height="30" fill="#131924"/>
        <text x="62" y="302" fill="#6E7887">…</text><text x="140" y="302" fill="#6E7887">…</text>
      </g>
    </g>

    <text x="48" y="346" font-family="'IBM Plex Mono',monospace" font-size="20" font-weight="500" fill="#E8EDF5">66,094</text>
    <text x="132" y="346" font-size="14.5" fill="#8A94A6">줄</text>

    <g>
      <rect x="48" y="368" width="360" height="66" rx="10" fill="#1C1719" stroke="#3D2C2E"/>
      <text x="68" y="394" font-size="14.5" font-weight="700" fill="#C97A6E">고객 목록이 없습니다</text>
      <text x="68" y="418" font-size="13.5" fill="#9A8A8C">같은 사람인지 아닌지 판단할 기준이 데이터에 없습니다</text>
    </g>
  </g>

  <!-- ── 가운데 : 옮기는 게 아니라 만들어 내는 일 ── -->
  <g>
    <path d="M430 240 h84" stroke="#3DD6C4" stroke-opacity=".55" stroke-width="2.5"/>
    <path d="M506 233 l10 7 -10 7" fill="none" stroke="#3DD6C4" stroke-opacity=".8" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="472" y="222" text-anchor="middle" font-family="'Noto Sans KR',system-ui,sans-serif"
          font-size="12.5" font-weight="700" fill="#3DD6C4">뽑아내기</text>
    <text x="472" y="270" text-anchor="middle" font-family="'Noto Sans KR',system-ui,sans-serif"
          font-size="12" fill="#6E7887">옮기는 게 아니라</text>
    <text x="472" y="288" text-anchor="middle" font-family="'Noto Sans KR',system-ui,sans-serif"
          font-size="12" fill="#6E7887">만들어 내는 일</text>
  </g>

  <!-- ── 오른쪽 : 새 시스템 ── -->
  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <text x="552" y="52" font-family="'IBM Plex Mono',monospace" font-size="11.5"
          letter-spacing="2" fill="#3DD6C4">AFTER</text>
    <text x="552" y="84" font-size="20" font-weight="800" fill="#E8EDF5">고객이 먼저 있어야 합니다</text>
    <text x="552" y="110" font-size="13.5" fill="#7C8698">주문 이력을 보려면 사람이 먼저 있어야 합니다.</text>

    <!-- 고객 -->
    <g>
      <rect x="552" y="132" width="360" height="82" rx="10" fill="#131F1E" stroke="#28453F"/>
      <text x="572" y="158" font-family="'IBM Plex Mono',monospace" font-size="11.5"
            letter-spacing="1.5" fill="#3DD6C4">고객</text>
      <text x="572" y="186" font-size="15.5" font-weight="700" fill="#E8EDF5">홍길동</text>
      <text x="572" y="206" font-family="'IBM Plex Mono',monospace" font-size="13" fill="#9FB0AC">010-1234-5678</text>
      <text x="820" y="186" font-size="12.5" fill="#3DD6C4" fill-opacity=".8">유일</text>
    </g>

    <!-- 붙는 주문들 -->
    <path d="M582 214 v26" stroke="#28453F" stroke-width="2"/>
    <path d="M582 240 h22" stroke="#28453F" stroke-width="2"/>
    <path d="M582 240 v34 h22" stroke="#28453F" stroke-width="2"/>
    <path d="M582 274 v34 h22" stroke="#28453F" stroke-width="2"/>

    <g font-family="'IBM Plex Mono',monospace" font-size="13" fill="#C7D0DC">
      <rect x="604" y="226" width="308" height="28" rx="7" fill="#161E2A" stroke="#2B3646"/>
      <text x="620" y="245">03-14  ·  A  ·  42,000</text>
      <rect x="604" y="260" width="308" height="28" rx="7" fill="#161E2A" stroke="#2B3646"/>
      <text x="620" y="279">05-02  ·  B  ·  18,000</text>
      <rect x="604" y="294" width="308" height="28" rx="7" fill="#161E2A" stroke="#2B3646"/>
      <text x="620" y="313">07-21  ·  A  ·  42,000</text>
    </g>

    <text x="552" y="346" font-family="'IBM Plex Mono',monospace" font-size="20" font-weight="500" fill="#E8EDF5">12,393</text>
    <text x="636" y="346" font-size="14.5" fill="#8A94A6">명</text>

    <g>
      <rect x="552" y="368" width="360" height="66" rx="10" fill="#131F1E" stroke="#28453F"/>
      <text x="572" y="394" font-size="14.5" font-weight="700" fill="#3DD6C4">기준을 사람이 정해야 합니다</text>
      <text x="572" y="418" font-size="13.5" fill="#9FB0AC">무엇을 같은 사람으로 볼 것인가 — 데이터에 답이 없습니다</text>
    </g>
  </g>
</svg>
