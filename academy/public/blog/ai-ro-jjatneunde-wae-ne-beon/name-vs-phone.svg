<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img"
     aria-label="같은 사람이 이름을 세 가지로 남겼다. 이름으로 세면 세 명이 되고 전화번호로 세면 한 명이 된다.">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
  </defs>
  <rect width="960" height="400" fill="url(#pbg)"/>

  <text x="48" y="48" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5"
        letter-spacing="2" fill="#F5A623">사람을 무엇으로 세는가</text>

  <!-- 원본 세 줄 -->
  <g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13.5">
    <rect x="48" y="76" width="268" height="34" rx="7" fill="#161E2A" stroke="#2B3646"/>
    <text x="66" y="99" fill="#E8EDF5">홍길동</text>
    <text x="176" y="99" fill="#6E7887">010-1234-5678</text>

    <rect x="48" y="118" width="268" height="34" rx="7" fill="#161E2A" stroke="#2B3646"/>
    <text x="66" y="141" fill="#E8EDF5">홍길동 상호</text>
    <text x="176" y="141" fill="#6E7887">010-1234-5678</text>

    <rect x="48" y="160" width="268" height="34" rx="7" fill="#161E2A" stroke="#2B3646"/>
    <text x="66" y="183" fill="#E8EDF5">홍길동(메모)</text>
    <text x="176" y="183" fill="#6E7887">010-1234-5678</text>
  </g>
  <text x="48" y="224" font-family="'Noto Sans KR',system-ui,sans-serif" font-size="13.5" fill="#7C8698">
    장부에 남은 세 줄. 이름은 다르고 번호는 같습니다.
  </text>

  <!-- 갈래 -->
  <path d="M330 135 C 372 135, 372 92, 414 92" fill="none" stroke="#C97A6E" stroke-opacity=".65" stroke-width="2.5"/>
  <path d="M330 135 C 372 135, 372 262, 414 262" fill="none" stroke="#3DD6C4" stroke-opacity=".65" stroke-width="2.5"/>

  <!-- 위 : 이름으로 세면 -->
  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <rect x="414" y="56" width="498" height="122" rx="12" fill="#1C1719" stroke="#3D2C2E"/>
    <text x="440" y="88" font-size="16" font-weight="800" fill="#C97A6E">이름으로 세면</text>
    <g font-family="'IBM Plex Mono',monospace" font-size="13" fill="#9A8A8C">
      <text x="440" y="118">홍길동</text>
      <text x="560" y="118">홍길동 상호</text>
      <text x="710" y="118">홍길동(메모)</text>
    </g>
    <text x="440" y="152" font-family="'IBM Plex Mono',monospace" font-size="30" font-weight="500" fill="#C97A6E">3</text>
    <text x="466" y="152" font-size="16" fill="#9A8A8C">명</text>
    <text x="512" y="152" font-size="13.5" fill="#8A7A7C">한 사람이 셋으로 늘어납니다</text>
  </g>

  <!-- 아래 : 전화번호로 세면 -->
  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <rect x="414" y="206" width="498" height="122" rx="12" fill="#131F1E" stroke="#28453F"/>
    <text x="440" y="238" font-size="16" font-weight="800" fill="#3DD6C4">전화번호로 세면</text>
    <text x="440" y="268" font-family="'IBM Plex Mono',monospace" font-size="13" fill="#9FB0AC">010-1234-5678</text>
    <text x="440" y="302" font-family="'IBM Plex Mono',monospace" font-size="30" font-weight="500" fill="#3DD6C4">1</text>
    <text x="466" y="302" font-size="16" fill="#9FB0AC">명</text>
    <text x="512" y="302" font-size="13.5" fill="#7E9A95">이름 변형은 따로 보관합니다</text>
  </g>

  <text x="48" y="368" font-family="'Noto Sans KR',system-ui,sans-serif" font-size="14" fill="#8A94A6">
    코드를 쓰는 일이 아니라, 무엇을 같은 사람으로 볼지 정하는 일이었습니다.
  </text>
</svg>
