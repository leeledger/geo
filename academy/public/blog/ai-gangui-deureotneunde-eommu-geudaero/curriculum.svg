<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="성인 AI 업무자동화반 8회 커리큘럼. 1회 AI 업무 활용 시작과 내 업무 고르기, 실습 업무 목록표. 2회 문서 업무, 회의록과 메일 초안. 3회 엑셀 함수와 현황판. 4회 매크로와 VBA, 파일 취합. 5회 구글 시트와 Apps Script, 문의 답장 초안. 6회 n8n과 Make, 요약 리포트와 영수증 장부. 7회 AI 비서와 작은 도구, FAQ 비서. 8회 내 업무 자동화 완성과 시연.">
  <rect width="1200" height="720" fill="#0B0F16"/>
  <style>
    text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
    .t{fill:#E8ECF2;font-size:30px;font-weight:800}
    .s{fill:#9AA4B2;font-size:19px}
    .n{font-family:'IBM Plex Mono',monospace;font-size:17px;fill:#F5A623}
    .h{fill:#E8ECF2;font-size:22px;font-weight:800}
    .o{fill:#3DD6C4;font-size:17px}
    .m{font-family:'IBM Plex Mono',monospace;font-size:15px;fill:#5B6573}
  </style>
  <text x="60" y="76" class="t">AI 업무자동화반 · 8회 커리큘럼</text>
  <text x="60" y="110" class="s">회당 120분 · 회차마다 실습 결과물 하나 · 8회에 내 업무 자동화 완성</text>

  <g>
    <rect x="60" y="150" width="255" height="230" rx="16" fill="#E8ECF2" fill-opacity="0.04" stroke="#2A3240" stroke-width="2"/>
    <text x="82" y="188" class="n">01회</text>
    <text x="82" y="226" class="h">AI 활용 시작</text>
    <text x="82" y="256" class="h">내 업무 고르기</text>
    <text x="82" y="330" class="o">▸ 업무 목록표</text>
    <text x="82" y="356" class="o">▸ 지시문 모음</text>
  </g>
  <g>
    <rect x="335" y="150" width="255" height="230" rx="16" fill="#E8ECF2" fill-opacity="0.04" stroke="#2A3240" stroke-width="2"/>
    <text x="357" y="188" class="n">02회</text>
    <text x="357" y="226" class="h">문서 업무</text>
    <text x="357" y="256" class="h">회의록·보고서·메일</text>
    <text x="357" y="330" class="o">▸ 회의록 요약 양식</text>
    <text x="357" y="356" class="o">▸ 메일 초안 모음</text>
  </g>
  <g>
    <rect x="610" y="150" width="255" height="230" rx="16" fill="#E8ECF2" fill-opacity="0.04" stroke="#2A3240" stroke-width="2"/>
    <text x="632" y="188" class="n">03회</text>
    <text x="632" y="226" class="h">엑셀 ①</text>
    <text x="632" y="256" class="h">함수·피벗·차트</text>
    <text x="632" y="330" class="o">▸ 월별 현황판</text>
  </g>
  <g>
    <rect x="885" y="150" width="255" height="230" rx="16" fill="#E8ECF2" fill-opacity="0.04" stroke="#2A3240" stroke-width="2"/>
    <text x="907" y="188" class="n">04회</text>
    <text x="907" y="226" class="h">엑셀 ②</text>
    <text x="907" y="256" class="h">매크로·VBA</text>
    <text x="907" y="330" class="o">▸ 파일 취합 매크로</text>
    <text x="907" y="356" class="o">▸ 명단 문서 대량 생성</text>
  </g>

  <g>
    <rect x="60" y="400" width="255" height="230" rx="16" fill="#E8ECF2" fill-opacity="0.04" stroke="#2A3240" stroke-width="2"/>
    <text x="82" y="438" class="n">05회</text>
    <text x="82" y="476" class="h">구글 시트</text>
    <text x="82" y="506" class="h">Apps Script</text>
    <text x="82" y="580" class="o">▸ 문의 → 답장 초안</text>
  </g>
  <g>
    <rect x="335" y="400" width="255" height="230" rx="16" fill="#E8ECF2" fill-opacity="0.04" stroke="#2A3240" stroke-width="2"/>
    <text x="357" y="438" class="n">06회</text>
    <text x="357" y="476" class="h">노코드 자동화</text>
    <text x="357" y="506" class="h">n8n · Make</text>
    <text x="357" y="580" class="o">▸ 아침 요약 리포트</text>
    <text x="357" y="606" class="o">▸ 영수증 → 장부</text>
  </g>
  <g>
    <rect x="610" y="400" width="255" height="230" rx="16" fill="#E8ECF2" fill-opacity="0.04" stroke="#2A3240" stroke-width="2"/>
    <text x="632" y="438" class="n">07회</text>
    <text x="632" y="476" class="h">AI 비서</text>
    <text x="632" y="506" class="h">작은 도구 만들기</text>
    <text x="632" y="580" class="o">▸ 업무 FAQ 비서</text>
    <text x="632" y="606" class="o">▸ 나만 쓰는 웹 도구</text>
  </g>
  <g>
    <rect x="885" y="400" width="255" height="230" rx="16" fill="#F5A623" fill-opacity="0.14" stroke="#F5A623" stroke-width="2"/>
    <text x="907" y="438" class="n">08회</text>
    <text x="907" y="476" class="h">내 업무 자동화</text>
    <text x="907" y="506" class="h">완성 · 시연</text>
    <text x="907" y="580" class="o" style="fill:#F5A623">▸ 매주 쓰는 자동화 1개</text>
  </g>

  <text x="1140" y="686" class="m" text-anchor="end">로봇&amp;코딩학원 · 서울 송파구 석촌동</text>
</svg>
