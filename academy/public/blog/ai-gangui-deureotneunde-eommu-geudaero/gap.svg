<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="강의가 채우는 자리와 비어 있는 자리. 도구 알기는 강의가 채운다. 내 일 중 맡길 것 고르기와 막히는 곳(계정 연결, API 키, 예약 설정) 넘기는 자리는 비어 있다. 그 둘을 지나야 매일 도는 자동화 하나가 나온다.">
  <rect width="1200" height="640" fill="#0B0F16"/>
  <style>
    text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
    .t{fill:#E8ECF2;font-size:30px;font-weight:800}
    .s{fill:#9AA4B2;font-size:20px}
    .h{fill:#E8ECF2;font-size:26px;font-weight:800}
    .m{font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:2px}
  </style>
  <text x="60" y="80" class="t">강의가 채우는 자리, 비어 있는 자리</text>
  <text x="60" y="116" class="s">도구를 아는 것에서 매일 도는 자동화까지, 네 칸</text>

  <!-- 1 filled -->
  <rect x="60" y="180" width="240" height="300" rx="18" fill="#3DD6C4" fill-opacity="0.12" stroke="#3DD6C4" stroke-width="2"/>
  <text x="84" y="220" class="m" fill="#3DD6C4">01 · 강의가 함</text>
  <text x="84" y="270" class="h">도구 알기</text>
  <text x="84" y="310" class="s">기능과 사용법</text>
  <text x="84" y="340" class="s">남의 활용 사례</text>
  <text x="84" y="370" class="s">강사의 예제</text>

  <!-- 2 empty -->
  <rect x="340" y="180" width="240" height="300" rx="18" fill="none" stroke="#F5A623" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="364" y="220" class="m" fill="#F5A623">02 · 비어 있음</text>
  <text x="364" y="270" class="h">내 일 고르기</text>
  <text x="364" y="310" class="s">한 주 몇 번, 몇 분</text>
  <text x="364" y="340" class="s">모양이 매번 같은가</text>
  <text x="364" y="370" class="s">틀리면 얼마나 아픈가</text>

  <!-- 3 empty -->
  <rect x="620" y="180" width="240" height="300" rx="18" fill="none" stroke="#F5A623" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="644" y="220" class="m" fill="#F5A623">03 · 비어 있음</text>
  <text x="644" y="270" class="h">막힌 곳 넘기</text>
  <text x="644" y="310" class="s">계정 연결</text>
  <text x="644" y="340" class="s">API 키 발급</text>
  <text x="644" y="370" class="s">예약 설정</text>

  <!-- 4 goal -->
  <rect x="900" y="180" width="240" height="300" rx="18" fill="#F5A623" fill-opacity="0.14" stroke="#F5A623" stroke-width="2"/>
  <text x="924" y="220" class="m" fill="#F5A623">04 · 목표</text>
  <text x="924" y="270" class="h">매일 도는</text>
  <text x="924" y="306" class="h">자동화 하나</text>
  <text x="924" y="350" class="s">내 컴퓨터에서</text>
  <text x="924" y="380" class="s">사람 없이</text>

  <path d="M304 330 h30 M584 330 h30 M864 330 h30" stroke="#5B6573" stroke-width="3"/>
  <text x="60" y="560" class="s">툴 31개를 한 번씩 만져 본 사람보다 자동화 하나를 매일 돌리는 사람이 일이 줄어든다</text>
  <text x="1140" y="610" class="m" fill="#5B6573" text-anchor="end">로봇&amp;코딩학원</text>
</svg>
