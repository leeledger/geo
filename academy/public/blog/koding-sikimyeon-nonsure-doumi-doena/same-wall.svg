<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img"
     aria-label="논술에서 막히는 자리와 코딩에서 막히는 자리가 같다. 무엇을 묻는지 파악, 순서 세우기, 곁가지 구분, 예외 처리, 버릴 것 정하기 다섯 가지가 나란히 대응한다.">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
  </defs>
  <rect width="960" height="500" fill="url(#wbg)"/>

  <text x="480" y="46" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="12" letter-spacing="2.5" fill="#8A94A6">아이가 막히는 자리</text>

  <!-- 머리 -->
  <text x="56" y="98" font-family="'Noto Sans KR',system-ui,sans-serif" font-size="22"
        font-weight="800" fill="#F5A623">논술</text>
  <text x="904" y="98" text-anchor="end" font-family="'Noto Sans KR',system-ui,sans-serif"
        font-size="22" font-weight="800" fill="#3DD6C4">코딩</text>

  <g font-family="'Noto Sans KR',system-ui,sans-serif" font-size="14.5">
    <!-- 1 -->
    <g>
      <rect x="56" y="120" width="340" height="52" rx="9" fill="#1A1610" stroke="#4A3A18"/>
      <text x="76" y="151" fill="#D9C39A">무엇을 묻는지 못 잡는다</text>
      <rect x="564" y="120" width="340" height="52" rx="9" fill="#111C1B" stroke="#24413C"/>
      <text x="584" y="151" fill="#9FB0AC">무엇을 만들지 못 정한다</text>
      <path d="M410 146 h140" stroke="#2B3646" stroke-width="1.5" stroke-dasharray="4 5"/>
    </g>
    <!-- 2 -->
    <g>
      <rect x="56" y="184" width="340" height="52" rx="9" fill="#1A1610" stroke="#4A3A18"/>
      <text x="76" y="215" fill="#D9C39A">어떤 순서로 놓을지 모른다</text>
      <rect x="564" y="184" width="340" height="52" rx="9" fill="#111C1B" stroke="#24413C"/>
      <text x="584" y="215" fill="#9FB0AC">큰 문제를 작게 못 나눈다</text>
      <path d="M410 210 h140" stroke="#2B3646" stroke-width="1.5" stroke-dasharray="4 5"/>
    </g>
    <!-- 3 -->
    <g>
      <rect x="56" y="248" width="340" height="52" rx="9" fill="#1A1610" stroke="#4A3A18"/>
      <text x="76" y="279" fill="#D9C39A">근거와 곁가지를 구분 못한다</text>
      <rect x="564" y="248" width="340" height="52" rx="9" fill="#111C1B" stroke="#24413C"/>
      <text x="584" y="279" fill="#9FB0AC">핵심과 곁가지를 구분 못한다</text>
      <path d="M410 274 h140" stroke="#2B3646" stroke-width="1.5" stroke-dasharray="4 5"/>
    </g>
    <!-- 4 -->
    <g>
      <rect x="56" y="312" width="340" height="52" rx="9" fill="#1A1610" stroke="#4A3A18"/>
      <text x="76" y="343" fill="#D9C39A">반대 입장을 처리 못한다</text>
      <rect x="564" y="312" width="340" height="52" rx="9" fill="#111C1B" stroke="#24413C"/>
      <text x="584" y="343" fill="#9FB0AC">예외를 처리 못한다</text>
      <path d="M410 338 h140" stroke="#2B3646" stroke-width="1.5" stroke-dasharray="4 5"/>
    </g>
    <!-- 5 -->
    <g>
      <rect x="56" y="376" width="340" height="52" rx="9" fill="#1A1610" stroke="#4A3A18"/>
      <text x="76" y="407" fill="#D9C39A">뭘 버릴지 못 정한다</text>
      <rect x="564" y="376" width="340" height="52" rx="9" fill="#111C1B" stroke="#24413C"/>
      <text x="584" y="407" fill="#9FB0AC">뭐부터 만들지 못 정한다</text>
      <path d="M410 402 h140" stroke="#2B3646" stroke-width="1.5" stroke-dasharray="4 5"/>
    </g>
  </g>

  <!-- 가운데 라벨 -->
  <g>
    <rect x="428" y="252" width="104" height="44" rx="10" fill="#141B26" stroke="#2B3646"/>
    <text x="480" y="280" text-anchor="middle" font-family="'Noto Sans KR',system-ui,sans-serif"
          font-size="15" font-weight="700" fill="#E8EDF5">같은 자리</text>
  </g>

  <text x="480" y="468" text-anchor="middle" font-family="'Noto Sans KR',system-ui,sans-serif"
        font-size="14" fill="#7C8698">
    다섯 개 다 문장력이 아니라 생각의 구조 문제입니다.
  </text>
</svg>
