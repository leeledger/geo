<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img"
     aria-label="엔트리와 스크래치는 블록으로 순서와 반복과 조건을 배우는 도구라는 점에서 같다. 엔트리는 국내에서 만들어 학교 교과서 기준인 경우가 많고 인공지능 블록이 붙어 있다. 스크래치는 MIT에서 만들어 남의 작품이 압도적으로 많다. 도구보다 중요한 것은 수업 방식이다. 예제를 따라 만들기만 하는 수업은 1년을 해도 혼자 못 만들고, 자기가 만들고 싶은 것을 정하고 필요한 것을 배우는 수업이라야 한다.">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
  </defs>
  <rect width="960" height="450" fill="url(#tbg)"/>

  <text x="480" y="42" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="12" letter-spacing="2.5" fill="#8A94A6">도구 고르기</text>

  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <rect x="56" y="66" width="404" height="122" rx="12" fill="#101820" stroke="#233240"/>
    <text x="80" y="100" font-size="19" font-weight="800" fill="#6FA8C7">엔트리</text>
    <text x="80" y="130" font-size="14" fill="#8C99A8">국내에서 만들었습니다.</text>
    <text x="80" y="152" font-size="14" fill="#8C99A8">학교 교과서가 엔트리 기준인 경우가 많습니다.</text>
    <text x="80" y="174" font-size="14" fill="#8C99A8">인공지능 블록이 붙어 있습니다.</text>

    <rect x="500" y="66" width="404" height="122" rx="12" fill="#101820" stroke="#233240"/>
    <text x="524" y="100" font-size="19" font-weight="800" fill="#6FA8C7">스크래치</text>
    <text x="524" y="130" font-size="14" fill="#8C99A8">MIT 에서 만들었습니다.</text>
    <text x="524" y="152" font-size="14" fill="#8C99A8">남이 만든 작품이 압도적으로 많습니다.</text>
    <text x="524" y="174" font-size="14" fill="#8C99A8">뜯어보는 게 좋은 공부가 됩니다.</text>

    <text x="480" y="132" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="15" fill="#4E5867">=</text>
  </g>

  <text x="480" y="216" text-anchor="middle" font-family="'Noto Sans KR',system-ui,sans-serif"
        font-size="14.5" fill="#6B7688">하나를 익히면 다른 하나는 며칠이면 적응합니다</text>

  <!-- 진짜 갈리는 곳 -->
  <text x="480" y="266" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="12" letter-spacing="2.5" fill="#F5A623">진짜 갈리는 곳은 여기입니다</text>

  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <rect x="56" y="284" width="404" height="112" rx="12" fill="#160F0F" stroke="#4A2622"/>
    <text x="80" y="318" font-size="17" font-weight="800" fill="#DCA9A1">예제를 따라 만들기만 하는 수업</text>
    <text x="80" y="350" font-size="14.5" fill="#B08A84">1년을 해도 혼자서는 아무것도 못 만듭니다.</text>
    <text x="80" y="374" font-size="14" fill="#8A6660">따라 만드는 동안 판단할 일이 없어서입니다.</text>

    <rect x="500" y="284" width="404" height="112" rx="12" fill="#111C1B" stroke="#24413C"/>
    <text x="524" y="318" font-size="17" font-weight="800" fill="#3DD6C4">만들고 싶은 걸 정하는 수업</text>
    <text x="524" y="350" font-size="14.5" fill="#C9D6D3">거기서 필요한 것을 배웁니다.</text>
    <text x="524" y="374" font-size="14" fill="#68796F">고를 일이 생기면 그때부터 사고가 붙습니다.</text>
  </g>

  <text x="480" y="432" text-anchor="middle" font-family="'Noto Sans KR',system-ui,sans-serif"
        font-size="14" fill="#8C99A8">아이에게 물어보세요. &quot;이거 왜 만들었어?&quot;</text>
</svg>
