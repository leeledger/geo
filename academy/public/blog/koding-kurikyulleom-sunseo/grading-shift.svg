<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img"
     aria-label="채점 기준이 바뀌었다. 예전에는 정답 코드와 일치하는가를 봤다. 답안지와 한 글자도 안 틀리게 쓴 아이가 잘한 아이였다. 지금은 실제로 작동했는가를 본다. 로봇이 목적지까지 갔는가, 만든 프로그램이 끝까지 돌았는가를 본다. AI가 코드를 써 주는 시대에는 이 차이가 더 벌어진다.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
  </defs>
  <rect width="960" height="360" fill="url(#gbg)"/>

  <text x="480" y="44" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="12" letter-spacing="2.5" fill="#8A94A6">채점 기준이 바뀌었다</text>

  <g font-family="'Noto Sans KR',system-ui,sans-serif">

    <!-- 예전 -->
    <rect x="56" y="92" width="376" height="164" rx="12" fill="#12181F" stroke="#232C38"/>
    <text x="244" y="128" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="12" letter-spacing="2" fill="#4E5867">예전</text>
    <text x="244" y="164" text-anchor="middle" font-size="21" font-weight="800" fill="#5D6878">정답 코드와</text>
    <text x="244" y="192" text-anchor="middle" font-size="21" font-weight="800" fill="#5D6878">일치하는가</text>
    <text x="244" y="226" text-anchor="middle" font-size="13" fill="#4E5867">답안지와 한 글자도 안 틀리게</text>

    <path d="M452 174 h56" stroke="#2B3646" stroke-width="1.6" stroke-dasharray="4 5"/>
    <path d="M500 168 l10 6 l-10 6" fill="none" stroke="#3DD6C4" stroke-width="1.8"/>

    <!-- 지금 -->
    <rect x="528" y="92" width="376" height="164" rx="12" fill="#111C1B" stroke="#24413C"/>
    <text x="716" y="128" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="12" letter-spacing="2" fill="#3DD6C4">지금</text>
    <text x="716" y="164" text-anchor="middle" font-size="21" font-weight="800" fill="#DDEDE9">실제로</text>
    <text x="716" y="192" text-anchor="middle" font-size="21" font-weight="800" fill="#DDEDE9">작동했는가</text>
    <text x="716" y="222" text-anchor="middle" font-size="13" fill="#7FA79F">로봇이 목적지까지 갔는가</text>
    <text x="716" y="242" text-anchor="middle" font-size="13" fill="#7FA79F">프로그램이 끝까지 돌았는가</text>
  </g>

  <text x="480" y="312" text-anchor="middle" font-family="'Noto Sans KR',system-ui,sans-serif"
        font-size="14" fill="#8A94A6">AI 가 코드를 써 주는 시대에는 이 차이가 더 벌어진다</text>
</svg>
