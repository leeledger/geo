<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img"
     aria-label="1부터 100까지의 합을 구하는 두 가지 방법. 방법 1은 하나씩 더한다. 1 더하기 2 더하기 3 하는 식으로 100까지, 덧셈을 99번 한다. 방법 2는 공식을 쓴다. 100 곱하기 101 나누기 2, 곱셈 한 번과 나눗셈 한 번이다. 둘 다 답은 5050이다. 답은 같고 절차의 길이가 다르다.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
  </defs>
  <rect width="960" height="360" fill="url(#gbg)"/>

  <text x="480" y="44" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="12" letter-spacing="2.5" fill="#8A94A6">1부터 100까지의 합</text>

  <g font-family="'Noto Sans KR',system-ui,sans-serif">
    <rect x="56" y="84" width="376" height="190" rx="12" fill="#12181F" stroke="#232C38"/>
    <text x="244" y="120" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="12" letter-spacing="2" fill="#4E5867">방법 1 · 하나씩 더하기</text>
    <text x="244" y="166" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="22" font-weight="700" fill="#8A94A6">1+2+3+…+100</text>
    <text x="244" y="206" text-anchor="middle" font-size="15" fill="#5D6878">덧셈 99번</text>
    <text x="244" y="248" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="16" fill="#5D6878">= 5050</text>

    <path d="M452 179 h56" stroke="#2B3646" stroke-width="1.6" stroke-dasharray="4 5"/>
    <path d="M500 173 l10 6 l-10 6" fill="none" stroke="#3DD6C4" stroke-width="1.8"/>

    <rect x="528" y="84" width="376" height="190" rx="12" fill="#111C1B" stroke="#24413C"/>
    <text x="716" y="120" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="12" letter-spacing="2" fill="#3DD6C4">방법 2 · 공식</text>
    <text x="716" y="166" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="22" font-weight="700" fill="#DDEDE9">100×101÷2</text>
    <text x="716" y="206" text-anchor="middle" font-size="15" fill="#7FA79F">곱셈 1번, 나눗셈 1번</text>
    <text x="716" y="248" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace"
          font-size="16" fill="#3DD6C4">= 5050</text>
  </g>

  <text x="480" y="318" text-anchor="middle" font-family="'Noto Sans KR',system-ui,sans-serif"
        font-size="14" fill="#8A94A6">답은 같다. 절차의 길이가 다르다 — 알고리즘은 이 차이를 보는 눈이다</text>
</svg>
