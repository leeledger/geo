<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>numbers 모션</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* 영상으로 굽는 페이지. 1920×1080 고정, 반응형·다크모드 불필요.
     숫자가 하나씩 서면서 마지막에 4회만 남는 구성이다.
     그 4회가 이 글의 요지라서 색을 거기에만 준다. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:#0B0F16;font-family:"Noto Sans KR",system-ui,sans-serif;color:#E8EDF5}
  .grid i{position:absolute;background:#1A2230}
  .grid .h{left:0;right:0;height:2px}

  .eb{position:absolute;left:120px;top:150px;font-family:"IBM Plex Mono",monospace;
      font-size:26px;letter-spacing:.2em;color:#F5A623}
  .row{position:absolute;left:120px;top:300px;display:flex;gap:120px}
  .stat .v{font-family:"IBM Plex Mono",monospace;font-size:104px;font-weight:500;letter-spacing:-.02em;line-height:1}
  .stat .u{font-size:34px;color:#8A94A6;margin-left:10px}
  .stat .k{font-size:26px;color:#7C8698;margin-top:18px}

  .four{position:absolute;left:120px;top:640px;display:flex;align-items:center;gap:34px;
        padding:34px 46px;border-radius:22px;background:#241B0C;border:3px solid rgba(245,166,35,.55)}
  .four .n{font-family:"IBM Plex Mono",monospace;font-size:86px;font-weight:500;color:#F5A623;line-height:1}
  .four .t{font-size:38px;font-weight:700;color:#F5A623}
  .foot{position:absolute;left:120px;top:860px;font-size:34px;color:#8A94A6}
  .foot b{color:#E8EDF5;font-weight:700}

  .in{opacity:0;transform:translateY(30px);filter:blur(7px);
      animation:in .6s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes in{to{opacity:1;transform:none;filter:blur(0)}}
  .d1{animation-delay:.3s}.d2{animation-delay:1.0s}.d3{animation-delay:1.7s}
  .d4{animation-delay:2.4s}.d5{animation-delay:3.1s}
  .d6{animation-delay:4.2s}.d7{animation-delay:5.3s}

  /* 위 숫자들은 마지막에 물러난다 — 4회가 주인공이 되게 */
  .row{animation:dim .9s ease 4.4s forwards}
  @keyframes dim{to{opacity:.34}}
</style>
</head>
<body>
<div class="grid"><i class="h" style="top:250px"></i><i class="h" style="top:600px"></i></div>

<div class="eb in d1">실제 납품 · 저장소에서 잰 수치</div>

<div class="row">
  <div class="stat in d2"><div><span class="v">5</span><span class="u">개월</span></div><div class="k">만든 기간</div></div>
  <div class="stat in d3"><div><span class="v">1,148</span><span class="u">번</span></div><div class="k">고친 횟수</div></div>
  <div class="stat in d4"><div><span class="v">85,067</span><span class="u">줄</span></div><div class="k">쓴 코드</div></div>
  <div class="stat in d5"><div><span class="v">66,094</span><span class="u">줄</span></div><div class="k">옮길 옛 데이터</div></div>
</div>

<div class="four in d6"><span class="n">4</span><span class="t">번 &nbsp;데이터 이관 시도</span></div>
<div class="foot in d7">코드는 AI가 썼습니다. <b>막힌 자리는 코드가 아니었습니다.</b></div>
</body>
</html>
