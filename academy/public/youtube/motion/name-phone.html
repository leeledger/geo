<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>name-phone 모션</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* 세 줄이 먼저 쌓이고, 갈래가 갈리고, 위(이름으로 세면 3명)가 먼저,
     아래(전화번호로 세면 1명)가 나중에 나온다.
     아래가 답이라서 위를 물러나게 하고 끝낸다. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:#0B0F16;font-family:"Noto Sans KR",system-ui,sans-serif;color:#E8EDF5}

  .eb{position:absolute;left:110px;top:110px;font-family:"IBM Plex Mono",monospace;
      font-size:24px;letter-spacing:.2em;color:#F5A623}

  .src{position:absolute;left:110px;top:190px;width:640px}
  .src .r{display:flex;justify-content:space-between;padding:22px 28px;margin-bottom:16px;
          border-radius:12px;background:#161E2A;border:2px solid #2B3646;
          font-family:"IBM Plex Mono",monospace;font-size:28px}
  .src .r .p{color:#6E7887}
  .src .cap{font-size:24px;color:#7C8698;margin-top:20px;line-height:1.5}

  .fork{position:absolute;left:780px;top:190px;width:170px;height:560px}
  .fork path{fill:none;stroke-width:5;stroke-linecap:round}

  .card{position:absolute;right:110px;width:900px;border-radius:20px;padding:38px 44px}
  .card.up{top:150px;background:#1C1719;border:3px solid #3D2C2E}
  .card.dn{top:520px;background:#131F1E;border:3px solid #28453F}
  .card .h{font-size:34px;font-weight:900;margin-bottom:24px}
  .card.up .h{color:#C97A6E} .card.dn .h{color:#3DD6C4}
  .card .names{display:flex;gap:44px;font-family:"IBM Plex Mono",monospace;font-size:25px;color:#9A8A8C}
  .card .ph{font-family:"IBM Plex Mono",monospace;font-size:26px;color:#9FB0AC}
  .card .cnt{display:flex;align-items:baseline;gap:14px;margin-top:26px}
  .card .cnt .n{font-family:"IBM Plex Mono",monospace;font-size:76px;font-weight:500;line-height:1}
  .card.up .cnt .n{color:#C97A6E} .card.dn .cnt .n{color:#3DD6C4}
  .card .cnt .u{font-size:30px} .card.up .cnt .u{color:#9A8A8C} .card.dn .cnt .u{color:#9FB0AC}
  .card .cnt .s{font-size:25px;margin-left:26px} .card.up .cnt .s{color:#8A7A7C} .card.dn .cnt .s{color:#7E9A95}

  .foot{position:absolute;left:110px;top:900px;font-size:32px;color:#8A94A6}
  .foot b{color:#E8EDF5;font-weight:700}

  .in{opacity:0;transform:translateY(26px);filter:blur(6px);
      animation:in .55s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes in{to{opacity:1;transform:none;filter:blur(0)}}
  .draw{stroke-dasharray:400;stroke-dashoffset:400;animation:draw .7s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  .d1{animation-delay:.3s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}
  .d5{animation-delay:2.1s}
  .d6{animation-delay:2.7s}.d7{animation-delay:3.1s}
  .d8{animation-delay:4.4s}.d9{animation-delay:4.8s}
  .d10{animation-delay:6.2s}

  .card.up{animation:dim .8s ease 5.0s forwards}
  @keyframes dim{to{opacity:.42}}
</style>
</head>
<body>

<div class="eb in d1">사람을 무엇으로 세는가</div>

<div class="src">
  <div class="r in d2"><span>홍길동</span><span class="p">010-1234-5678</span></div>
  <div class="r in d3"><span>홍길동 상호</span><span class="p">010-1234-5678</span></div>
  <div class="r in d4"><span>홍길동(메모)</span><span class="p">010-1234-5678</span></div>
  <div class="cap in d5">장부에 남은 세 줄.<br>이름은 다르고 번호는 같습니다.</div>
</div>

<svg class="fork" viewBox="0 0 170 560">
  <path class="draw d6" d="M0 190 C 70 190, 70 90, 160 90" stroke="#C97A6E" stroke-opacity=".7"/>
  <path class="draw d8" d="M0 190 C 70 190, 70 460, 160 460" stroke="#3DD6C4" stroke-opacity=".7"/>
</svg>

<div class="card up in d7">
  <div class="h">이름으로 세면</div>
  <div class="names"><span>홍길동</span><span>홍길동 상호</span><span>홍길동(메모)</span></div>
  <div class="cnt"><span class="n">3</span><span class="u">명</span><span class="s">한 사람이 셋으로 늘어납니다</span></div>
</div>

<div class="card dn in d9">
  <div class="h">전화번호로 세면</div>
  <div class="ph">010-1234-5678</div>
  <div class="cnt"><span class="n">1</span><span class="u">명</span><span class="s">이름 변형은 따로 보관합니다</span></div>
</div>

<div class="foot in d10">코드를 쓰는 일이 아니라, <b>무엇을 같은 사람으로 볼지 정하는 일</b>이었습니다.</div>
</body>
</html>
