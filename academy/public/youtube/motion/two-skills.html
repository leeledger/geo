<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>two-skills 모션</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /*
    도해를 통째로 띄우면 25초가 한계다. 요소를 순서대로 들여보내면
    같은 도해가 90초까지 버틴다. 그 사이 말이 얹힌다.

    영상으로 굽는 페이지라 반응형·다크모드가 필요 없다.
    1920×1080 고정으로 그리고 Playwright 로 녹화한다.
  */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:#0B0F16;font-family:"Noto Sans KR",system-ui,sans-serif;color:#E8EDF5}

  .grid{position:absolute;inset:0;opacity:.5}
  .grid i{position:absolute;background:#1A2230}
  .grid .h{left:0;right:0;height:2px}
  .grid .v{top:0;bottom:0;width:2px}

  .stage{position:absolute;inset:0;padding:96px 120px}

  .split{position:absolute;left:50%;top:120px;bottom:200px;width:2px;background:#232E3D;
         transform:translateX(-1px) scaleY(0);transform-origin:top;
         animation:grow .7s cubic-bezier(.16,1,.3,1) .2s forwards}
  @keyframes grow{to{transform:translateX(-1px) scaleY(1)}}

  .col{position:absolute;top:150px;width:700px}
  .col.l{left:120px}
  .col.r{right:120px}

  .eb{font-family:"IBM Plex Mono",monospace;font-size:24px;letter-spacing:.22em;margin-bottom:14px}
  .col.l .eb{color:#F5A623}
  .col.r .eb{color:#3DD6C4}
  h2{font-size:58px;font-weight:900;letter-spacing:-.03em;margin-bottom:16px}
  .lede{font-size:31px;font-weight:700;margin-bottom:44px}
  .col.l .lede{color:#F5A623}
  .col.r .lede{color:#3DD6C4}

  .row{display:flex;align-items:center;gap:22px;height:104px;border-radius:18px;
       padding:0 30px;margin-bottom:20px;font-size:31px;color:#C7D0DC}
  .col.l .row{background:#161E2A;border:2px solid #2B3646}
  .col.r .row{background:#131F1E;border:2px solid #28453F}
  .dot{width:16px;height:16px;border-radius:50%;flex:none}
  .col.l .dot{background:#F5A623}
  .col.r .dot{background:#3DD6C4}

  .foot{position:absolute;left:120px;right:120px;bottom:104px;font-size:27px;color:#8A94A6;
        text-align:center}

  /* ── 등장 : 아래에서 살짝 올라오며 흐림이 풀린다 ── */
  .in{opacity:0;transform:translateY(26px);filter:blur(6px);
      animation:in .62s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes in{to{opacity:1;transform:none;filter:blur(0)}}

  /* 순서 — 말이 얹히는 속도에 맞췄다 */
  .d1{animation-delay:.35s}  .d2{animation-delay:.85s}
  .d3{animation-delay:1.45s} .d4{animation-delay:2.05s} .d5{animation-delay:2.65s}
  .d6{animation-delay:3.55s} .d7{animation-delay:4.05s}
  .d8{animation-delay:4.65s} .d9{animation-delay:5.25s} .d10{animation-delay:5.85s}
  .d11{animation-delay:6.9s}

  /* 왼쪽이 끝나면 한 톤 죽인다. 시선이 오른쪽으로 넘어가게 */
  .col.l{animation:dim .8s ease 6.2s forwards}
  @keyframes dim{to{opacity:.42}}
</style>
</head>
<body>

<div class="grid">
  <i class="h" style="top:270px"></i><i class="h" style="top:540px"></i><i class="h" style="top:810px"></i>
  <i class="v" style="left:320px"></i><i class="v" style="left:640px"></i>
  <i class="v" style="left:1280px"></i><i class="v" style="left:1600px"></i>
</div>

<div class="stage">
  <div class="split"></div>

  <div class="col l">
    <div class="eb in d1">CODING</div>
    <h2 class="in d1">코딩 교육</h2>
    <div class="lede in d2">시키는 법을 배웁니다</div>
    <div class="row in d3"><i class="dot"></i>순서를 정한다</div>
    <div class="row in d4"><i class="dot"></i>반복할 곳을 찾는다</div>
    <div class="row in d5"><i class="dot"></i>조건을 나눈다</div>
  </div>

  <div class="col r">
    <div class="eb in d6">AI</div>
    <h2 class="in d6">AI 교육</h2>
    <div class="lede in d7">무엇을 시킬지 정하는 법을 배웁니다</div>
    <div class="row in d8"><i class="dot"></i>지금 뭐가 문제인가</div>
    <div class="row in d9"><i class="dot"></i>무엇부터 푸는가</div>
    <div class="row in d10"><i class="dot"></i>나온 답이 맞는가</div>
  </div>

  <div class="foot in d11">막힌 자리는 언제나 오른쪽이었습니다</div>
</div>

</body>
</html>
