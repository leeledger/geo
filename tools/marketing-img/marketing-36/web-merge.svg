<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="960" height="500" fill="#F7F8FA"/>
  <text x="48" y="64" font-size="30" font-weight="700" fill="#111827">윈도 PC·아이폰·갤럭시는 브라우저에서</text>
  <text x="48" y="100" font-size="18" fill="#4B5563">문서딱 PDF 합치기 · 가입·설치 없이 무료</text>

  <g font-size="21" font-weight="700" text-anchor="middle">
    <rect x="48" y="136" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="173" y="200" fill="#111827">파일 고르기</text>
    <text x="330" y="200" fill="#9CA3AF" font-size="30">→</text>
    <rect x="362" y="136" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="487" y="200" fill="#111827">목록에서 순서 맞추기</text>
    <text x="644" y="200" fill="#9CA3AF" font-size="30">→</text>
    <rect x="676" y="136" width="236" height="110" rx="14" fill="#1D4ED8"/>
    <text x="794" y="200" fill="#FFFFFF">합치기</text>
  </g>

  <text x="48" y="306" font-size="22" font-weight="700" fill="#111827">한 번에 합칠 수 있는 양</text>
  <g text-anchor="middle">
    <rect x="48" y="326" width="270" height="130" rx="14" fill="#EFF6FF"/>
    <text x="183" y="390" font-size="40" font-weight="700" fill="#1D4ED8">50개</text>
    <text x="183" y="428" font-size="18" fill="#1E3A8A">파일 수</text>
    <rect x="345" y="326" width="270" height="130" rx="14" fill="#EFF6FF"/>
    <text x="480" y="390" font-size="40" font-weight="700" fill="#1D4ED8">500 MB</text>
    <text x="480" y="428" font-size="18" fill="#1E3A8A">PC 합계</text>
    <rect x="642" y="326" width="270" height="130" rx="14" fill="#EFF6FF"/>
    <text x="777" y="390" font-size="40" font-weight="700" fill="#1D4ED8">150 MB</text>
    <text x="777" y="428" font-size="18" fill="#1E3A8A">휴대폰 합계</text>
  </g>
</svg>
